name: Deploy

# Dormant until the repository variable DEPLOY_ENABLED is set to "true".
# Enable it only after workstream 7 (infra/) is merged and the dev and prod
# GitHub environments exist with the variables listed in docs/ci.md.

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  TOFU_VERSION: "1.13.1"

jobs:
  infra:
    name: Infra (${{ matrix.environment }})
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # dev first, then prod. A failed dev run stops prod.
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        environment: [dev, prod]
    # Required reviewers and the main-only deployment branch rule live on the
    # environment in GitHub settings. Prod approval is enforced there.
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
      - name: Init
        working-directory: infra/envs/${{ matrix.environment }}
        run: tofu init -input=false
      - name: Plan
        working-directory: infra/envs/${{ matrix.environment }}
        run: tofu plan -input=false -out=tfplan
      - name: Apply
        working-directory: infra/envs/${{ matrix.environment }}
        run: tofu apply -input=false tfplan

  # Application deploys (static export to Static Web Apps, API image to Container
  # Apps) are not defined yet. They wait for the workstream 7 outputs.
