name: PR checks

on:
  pull_request:
    branches: [main]

# Read-only by default. Jobs that need more declare it themselves.
permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Area locations. The commands each job runs are listed in docs/ci.md.
  WEB_DIR: apps/web
  API_DIR: apps/api
  INFRA_DIR: deployment/terraform
  NODE_VERSION: "24"
  TERRAFORM_VERSION: "1.9.8"
  TFLINT_VERSION: "v0.55.1"

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.areas.outputs.web }}
      api: ${{ steps.areas.outputs.api }}
      infra: ${{ steps.areas.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/**'
            api:
              - 'apps/api/**'
              - 'content/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/**'
            infra:
              - 'deployment/terraform/**'
              - 'scripts/infra.sh'
              - '.github/workflows/**'
      # An area job runs only when its paths changed and its directory exists on this branch.
      - id: areas
        env:
          CHANGED_WEB: ${{ steps.filter.outputs.web }}
          CHANGED_API: ${{ steps.filter.outputs.api }}
          CHANGED_INFRA: ${{ steps.filter.outputs.infra }}
        run: |
          [[ "$CHANGED_WEB" == "true" && -d "$WEB_DIR" ]] && web=true || web=false
          [[ "$CHANGED_API" == "true" && -d "$API_DIR" ]] && api=true || api=false
          [[ "$CHANGED_INFRA" == "true" && -d "$INFRA_DIR" ]] && infra=true || infra=false
          {
            echo "web=$web"
            echo "api=$api"
            echo "infra=$infra"
          } >> "$GITHUB_OUTPUT"

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --dir "$WEB_DIR" run lint
      - name: Type check
        run: pnpm --dir "$WEB_DIR" run typecheck
      - name: Unit tests
        run: pnpm --dir "$WEB_DIR" run test

  api:
    name: API
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install
        run: uv sync --locked --directory "$API_DIR"
      - name: Lint
        run: |
          uv run --directory "$API_DIR" ruff check .
          uv run --directory "$API_DIR" ruff format --check .
      - name: Type check
        run: uv run --directory "$API_DIR" mypy src
      - name: Unit tests
        run: uv run --directory "$API_DIR" pytest

  infra:
    name: Infra
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - name: Format, validate and lint
        run: scripts/infra.sh check

  # Single required status for branch protection. Path-filtered jobs that do not
  # run are reported as skipped, which this job accepts.
  checks:
    name: PR checks
    needs: [changes, web, api, infra]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e '[.[].result] | all(. == "success" or . == "skipped")'
