  - kind: "text"
    id: "d10-screen-how-to-make-words"
    title: "How to Make New Words Come Alive"
    cards:
      - title: "Scoring"
        body: |-
          0-6 correct answers — *Below Average*; 7-13 correct answers — *Average*; 14-20 correct answers — *Above Average*; 21-25 correct answers — *Superior*
      - title: "How to Make New Words Come Alive"
        body: |-
          Learning new words is a lot easier than you may think — provided you go about it in the right way.

          The secret of successful vocabulary building is *repetition*.

          To add a new word to your vocabulary so that it really sticks there — permanently, unforgettably, usefully — you must see or hear that word in many different contexts and in a variety of different forms.

          Your first contact with a new word will be a fuzzy one — you will see in it no more than a meaningless pattern of syllables, a lifeless collection of letters. But at each successive contact, if the word is an integral part of a sentence, an idea, a thought, you will feel more and more life in the once-dead syllables, until finally you will be able to make an instantaneous mental reaction every time you read the word on a page of print or hear it from somebody's lips.

          You will then have taken the first crucial step toward getting on friendly terms with a new word; you will have made it part of your *recognition vocabulary*.

          Your attitude toward the word has thus far been a passive one. But you must also develop an active attitude. You must begin to use the word. You must learn to call it forth from the recesses of your recognition vocabulary whenever, in thinking, speaking, or writing, you have a use for it. You must, in short, add it to your *functional vocabulary*.

          Here are the steps that will help you do all these things.
  - kind: "text"
    id: "d10-screen-step-1"
    title: "Step 1: Consider Each New Word a Challenge"
    cards:
      - title: "Consider Each New Word a Challenge"
        body: |-
          There is always a great temptation to ignore an unfamiliar word that you meet in your reading — to skip over it quickly and blindly if you can manage to extract some meaning, however slight, from the sentence or paragraph in which it occurs. *Resist this temptation.* Consider a new word a red light, a stop sign, a challenge to your imagination and ingenuity. Look at it, become familiar with its appearance, puzzle out its possible meaning from the context.

          Try this now. Here are eight words that may be new to you. They are admittedly not everyday terms, and they are fairly complex in meaning; indeed, they have been chosen for these very qualities. Examine the sentence fragment in which each word appears, arrive at a probable or possible meaning, even make a wild guess if you wish — but at least come to grips with the challenge with which each of the words will confront you.

          1. felt so listless, so completely *enervated*: (a) weakened, (b) tired, (c) confused, (d) defeated
          2. such contemptible *sycophancy*: (a) insincere virtuousness, (b) self-seeking flattery, (c) pretense at genuineness, (d) sneakiness and spying
          3. no organic disease, but a kind of persistent *hypochondria*: (a) illness of psychological origin, (b) morbid fancies that one is ill, though physically healthy, (c) attitude of unhealthy fear, (d) state of mental delusions
          4. so withdrawn and *introverted* as to seem positively unsociable: (a) preferring solitude to the company of others, (b) insulting and hostile in conversation, (c) morbidly silent, (d) more interested in one's thoughts, feelings, etc., than in the outside world
          5. such outspoken *misogyny* as to alienate, if not repel, all women: (a) fear of women, (b) hatred of women, (c) pursuit of women, (d) discourtesy to women
          6. her *altruistic* generosity: (a) showing more concern for the welfare of others than for one's own welfare, (b) unlimited, (c) pretended and insincere, (d) well advertised
          7. his name, which is *anathema* to all patriots: (a) an object of speculation, (b) an object of the deepest loathing, (c) an object of respect and devotion, (d) an example of true and unselfish loyalty
          8. *disparaged* every attempt he made: (a) blocked, (b) supported, (c) criticized, (d) belittled
  - kind: "text"
    id: "d10-screen-step-2"
    title: "Step 2: Check Up on Your Response to the Challenge"
    cards:
      - title: "Check Up on Your Response to the Challenge"
        body: |-
          You have here been offered a choice of possible meanings for each of the italicized words; in your own efforts, of course, you will think of one or more possibilities by yourself. As you puzzle out each word in the context in which you find it, your guesses may be correct, they may be close though not absolutely exact, or they may be far, far afield. No matter. You're working with the word, you're thinking about it, you're developing a mind-set that gives the new word an unobstructed entry into your recognition vocabulary. Having done this, your next and obvious step is to refer to a good dictionary to check up on your success in figuring out meanings. For valuable practice, make such reference to a dictionary at this very moment in respect to the eight words, to see how well you figured out their meanings. (A key to this exercise is deliberately omitted.)
  - kind: "text"
    id: "d10-screen-step-3"
    title: "Step 3: Practice Pronouncing and Spelling Each Word"
    cards:
      - title: "Practice Pronouncing and Spelling Each Word"
        body: |-
          Now you have the word in front of you in the dictionary. You see its pronunciation. You are getting a second visual impression of its appearance. And you will note that it may have other forms for use as different parts of speech (adjective, noun, verb, etc.). Say the word (and any of its derivative forms) aloud. Get accustomed to hearing it in your own voice. Write the word once or twice so that you will be reacting to it muscularly as well as visually and vocally. These activities will be a giant step forward in getting on such good terms with the word that it can easily pass into your functional vocabulary and be ready for immediate use when the occasion occurs.

          Do this now with our eight words. Say them aloud. Then cover each one and try spelling it correctly in the blank provided for that purpose.

          1. *enervated* ____ / *enervating* ____ / (to) *enervate* ____ / *eneveration* ____
          2. *sycophancy* ____ / (a) *sycophant* ____ / *sycophantic* ____
          3. *hypochondria* ____ / *hypochondriacal* ____ / (a) *hypochondriac* ____
          4. *introverted* ____ / *introversion* ____ / (an) *introvert* ____
          5. *misogyny* ____ / *misogynous* ____ / *misogynistic* ____ / (a) *misogynist* ____
          6. *altruistic* ____ / *altruism* ____ / (an) *altruist* ____
          7. *anathema* ____ / (to) *anathematize* ____ / *anathematization* ____
          8. (to) *disparage* ____ / *disparagement* ____ / *disparaging* ____

          Just three simple steps to add a new word to your recognition and functional vocabulary: keep a sharp eye open to its first appearance, and in meeting it, puzzle out a possible meaning; look it up to determine how successfully you reacted to it; then practice saying it aloud and writing it. Do this as time and circumstances and your reading habits make possible, and you will be truly amazed at how many words will enter your vocabulary almost every day; how you will become more and more aware of their deeper meanings and various forms and uses as you continue meeting them in your reading; how you will become so familiar with them that, practically without being aware of it, you will start to use them in your thinking, your speaking, and your writing.

          Do not accept these promises on faith; learn how true they are from your own experience. Here are three more exercises to make these eight words come fully alive for you, to nail them down in your vocabulary, to make them integral factors in your thinking, understanding, and self-expression.
