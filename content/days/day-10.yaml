  - kind: "text"
    id: "d10-screen-reading-plan"
    title: "A Reading Plan for Enriching Your Vocabulary"
    cards:
      - title: "Keep Going"
        body: |-
          All right. You've seen these eight words. You've thought about them. You've looked them up. You've pronounced them. You've spelled them. You've reacted to them in a variety of different ways. And so now they are yours — no one can ever take them from you.

          This has happened in perhaps only 30 minutes.

          Is this good? *It is absolutely spectacular.* The average adult who takes no active steps toward improving his vocabulary learns at most 25 to 50 new words a year. Yet, by following the simple and easy procedures outlined here, you can add 8 to 14 new words (to say nothing of the scores of derivative forms) to your vocabulary every day you read — 2000 to 3000 words a year!

          But how can you be sure to make the frequent and repeated contacts with new words that are so essential to building a large and rich vocabulary? The answer to this vital question will be spelled out in the remaining pages of this chapter.
      - title: "A Reading Plan for Enriching Your Vocabulary"
        body: |-
          Building your vocabulary effectively will involve treating yourself to an all-around liberal education. You will become wholly engaged and completely engrossed in the pursuit not only of new words but also of new ideas — not only of words as symbols of information, knowledge, and understanding, but of the information, knowledge, and understanding itself.

          This was, curiously enough, the system by which you operated in your childhood. During your earliest years you learned more new words, and at a faster rate, than at any other period in your life; day in and day out you squeezed every possible ounce of learning out of each waking moment, for a child has a constant and insatiable desire to know and to understand. And so, as your knowledge and your understanding increased, there was a corresponding daily increase in your store of those language symbols that described, and made it possible for you to think about and express, what you had learned.

          Now that you are an adult, you have perhaps lost the strong inner drive to continue learning. If so, do not despair. You can reactivate this drive. You can recapture your former urge to know and understand, and as a direct result you can again increase your vocabulary at the same dynamic pace and in the same atmosphere of excitement that were characteristic of your childhood.

          You can do this no matter what your present age or previous education.

          *You can do this by exploring, through reading, new and unfamiliar fields of human knowledge, thinking, and experience.*

          Below is a plan of systematic reading that will help you explore such fields — fields which will add to your vocabulary literally thousands of new, rich, meaningful, and useful words.

          In each field you will find recommended the clearest and the most interesting volume available. These are not textbooks. On the contrary, they were written for the person with little or no background in the subject.

          They are not necessarily easy books, yet none of them present difficulties of any major order. In combination, they offer a challenge which, when successfully met, will have a powerful effect on you. They will broaden your understanding and provide you with the words and concepts you need to express your thinking and to grasp the thoughts of others.

          And this, bear in mind, is the ultimate purpose of any intelligent vocabulary building. *If words do not serve this purpose, they serve no purpose at all.*
  - kind: "text"
    id: "d10-screen-recommended-readings"
    title: "Recommended Readings"
    cards:
      - title: "Recommended Readings"
        body: |-
          1. Psychology — *The Human Mind*, by Karl A. Menninger (Knopf)
          2. Science — *Ever Since Darwin*, by Stephen Jay Gould (Norton)
          3. Semantics — *Language in Thought and Action*, by S. I. Hayakawa (Harcourt, Brace Jovanovich)
          4. Philosophy — *The Story of Philosophy*, by Will Durant (Washington Square Press)
          5. Art and Music — *The Arts*, by Hendrik Willem van Loon (Liveright)
          6. Mathematics — *Mathematics for the Million*, by Lancelot Hogben (Norton)

          These six books will provide a point of departure. Each is, in its own field, a quick survey course. Together they are the core of a liberal-arts education.

          When you have finished these volumes, you will have a running acquaintance with the general content of several vital fields of human knowledge. You will be ready to take another step in attaining a vocabulary that contains the tools for clear thinking and expression.

          This step involves *specialization* in various branches of one or more fields that particularly intrigue you. Your own interests, as they develop from your survey reading, will dictate your choice of titles in each field. On pages 72 and 73 is a list of suggestions to guide you, and the abundant bibliographies contained in most survey volumes will serve as added guides. But feel free to make excursions down any side road of knowledge that your newly awakened interests may suggest.
      - title: "Remain on the Alert for New Words"
        body: |-
          There will come a time, as you continue your explorations, when you discover that reading not only powerfully satisfies the urge to learn, but offers unique pleasures and mental stimulation.

          You will then be impelled to strike out into new realms of reading. If previously you had read little, or had read only the lightest sort of material, you will find that reading has now become an enjoyable habit. And so you will begin to turn, for pure reading enjoyment, to the deeper and more significant novels; you will seek out general books and magazines that are addressed to the literate, discriminating, and thoughtful reader. The quantity of your reading will become considerably greater, its character much more varied, and its quality infinitely more mature and therefore infinitely more gratifying.

          Turning to such reading will be an indication of your renewed intellectual growth, of a recaptured desire to reach out mentally and push back your horizons of thinking and understanding. And your new kind of reading will offer a rich source of valuable words — words of deeper, subtler, and more complex meaning than those you perhaps had previously been familiar with or accustomed to using.

          Because you will have developed the habit of being alert and receptive to new words, of reacting to them, of looking them up in a dictionary, of working with them and thinking about them, a strange and wonderful thing will happen. A word which you have looked up, which you have said aloud and have actually put down in writing, will begin to appear over and over again in your varied reading — not because it has suddenly become popular with authors, but because you have let it register deeply in your mind. You have become strongly aware of its existence, and you are, without consciously realizing it, sharply alerted to the next appearance of the word in print.

          Each succeeding time you meet this word in a different context, its meaning will become clearer, its use more familiar — until finally it will be an old friend and you will find yourself using it naturally and correctly in your speaking and writing.

          This is the way new words enter fully, actively, and permanently into your vocabulary.
      - title: "Listen for New Words"
        body: |-
          There is yet another source of material for building your vocabulary.

          That source is the people around you.

          If you actively *look* for new words, you will be amazed at how many you will find.

          If you actively *listen* for new words, you will be equally amazed at how many you will hear.

          But you must become as alert and as receptive in your listening as in your looking. Does someone you are speaking to use a word you have not heard before, or a word whose meaning is not completely clear to you? *Ask about it!* Have no reluctance, feel no shame in saying, forthrightly and immediately, "What does that word mean?" Anyone is flattered when such a question is posed. He will be eager and happy to attempt an answer — and you may not only learn a new word but often be on the trail of a new idea, a new bit of information or knowledge.

          Do you play Scrabble, Keyword, Ghost, or similar games? These are excellent vocabulary builders if you remain on the alert for new words; if you ask, when a player offers an unfamiliar term, "What does that word mean?" and listen attentively to his answer.
  - kind: "text"
    id: "d10-screen-lifelong"
    title: "A Lifelong Process"
    cards:
      - title: "A Lifelong Process"
        body: |-
          How long will it take you to build your word stock to full strength? The process of vocabulary improvement, since it is a by-product of learning and of intellectual growth, need never end; you can be engaged in the exciting and rewarding activities outlined in this chapter for the rest of your life.

          But the dividends will accrue from the moment you begin — your vocabulary will start increasing, at a spectacular rate, from the day you take your first step.

          The words, and the ideas and knowledge that words symbolize, are all there. You have only to develop the habit of actively hunting for them.
      - title: "Additional Recommended Reading"
        body: |-
          *I. For specialization in various fields*

          1. PSYCHOLOGY: *Cognitive Therapy & The Emotional Disorders*, by Aaron T. Beck (Meridian); *I'm O.K., You're O.K.*, by Thomas A. Harris (Avon).
          2. SCIENCE: *Ascent of Man*, by Jacob Bronowski (Little, Brown); *The Sea Around Us*, by Rachel Carson (Oxford); *Red Giants & White Dwarfs*, by Robert Jastrow (Norton); *The ABC of Relativity*, by Bertrand Russell (Mentor); *The Lives of a Cell: Notes of a Biology Watcher*, by Lewis Thomas (Bantam); *The Double Helix*, by James D. Watson (Mentor).
          3. SEMANTICS: *The Power of Words*, by Stuart Chase (Harcourt Brace Jovanovich); *The American Language: An Inquiry into the Development of English in the United States*, by H. L. Mencken, abr. 4th edition, Raven I. McDavid, Jr., ed. (Knopf).
          4. PHILOSOPHY: *Against the Current: Essays in the History of Ideas*, by Isaiah Berlin, Henry Hardy, ed. (Penguin); *Pleasures of Philosophy*, by Will Durant (Simon and Schuster).
          5. ART AND MUSIC: *The Story of Art*, by E. H. Gombrich (Prentice-Hall); *Lust for Life*, by Irving Stone (Doubleday); *What to Listen for in Music*, by Aaron Copeland (Mentor).
          6. MATHEMATICS: *One, Two, Three . . . INFINITY*, by George Gamow (Bantam).

          *II. Magazines for the general reader*

          *The Atlantic Monthly; Harper's Magazine; Natural History; Newsweek; The New Yorker; Psychology Today; Time.*

          *III. Dictionaries*

          *Webster's New World Dictionary: Modern Desk Edition* (Collins); *Webster's Ninth New Collegiate Dictionary* (Merriam-Webster); *Random House College Dictionary* (Random House); *American Heritage Dictionary, New College Edition* (Houghton Mifflin).
