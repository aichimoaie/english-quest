day: 10
title: "A Simple Program for Vocabulary Improvement"

vocabulary:
  - word: "enervate"
    definition: "to weaken or drain the strength of someone or something"
    example: "A long, hot walk can enervate even a fit person."
    audio_ref: "d10-vocab-enervate"
  - word: "sycophant"
    definition: "a person who flatters someone important to gain favor"
    example: "The sycophant laughed at every joke the manager made."
    audio_ref: "d10-vocab-sycophant"
  - word: "introvert"
    definition: "a person who is more interested in their own thoughts and feelings than in others"
    example: "She is a quiet introvert who enjoys reading alone."
    audio_ref: "d10-vocab-introvert"
  - word: "altruistic"
    definition: "showing concern for the welfare of others before one's own"
    example: "His altruistic work helped many families in the town."
    audio_ref: "d10-vocab-altruistic"
  - word: "disparage"
    definition: "to speak of someone or something as unimportant or of little value"
    example: "It is unkind to disparage a friend's hard work."
    audio_ref: "d10-vocab-disparage"
  - word: "anathema"
    definition: "something that people strongly hate or reject"
    example: "Cheating is anathema to the members of the team."
    audio_ref: "d10-vocab-anathema"

screens:
  - kind: "text"
    id: "d10-screen-part-three"
    title: "Part III: Improve Your Vocabulary!"
    cards:
      - title: "Improve Your Vocabulary!"
        body: |-
          Vocabulary is important! Success not only in school and college, but also in one's professional and business life, has an eminently logical connection with the number of words one knows and can recognize and use.

          So in Part III we get down to some intensive work in vocabulary-building.
  - kind: "text"
    id: "d10-screen-introduction"
    title: "A Simple Program for Vocabulary Improvement"
    cards:
      - title: "Tenth Day"
        body: "To increase your vocabulary at a prodigious rate, you must learn to be on the alert for new words."
      - title: "Vocabulary Is Important!"
        body: |-
          In our modern world, the person with a good vocabulary has a better chance of success, other things being equal—a better chance of success not only in his school career but also when he gets out into the business or professional world.

          Let us take a look at some of the evidence that points to this intimate relationship between vocabulary and scholastic, business, and professional success.

          Research has established that the person who scores high in vocabulary is likely to possess above-average mental endowment. A vocabulary test provides as reliable a measure of intelligence as any combination of the three units in the Stanford-Binet I.Q. tests, according to Professor Lewis S. Terman, one of the foremost authorities in the field.

          At the University of Illinois, entering students are routinely given a short vocabulary test. From the results, an accurate prediction can be made of probable academic success — or lack of success — over the entire four-year college course.

          At many other universities, groups of freshmen are put into experimental classes for the sole purpose of increasing their knowledge of English words. These students do far better in their sophomore, junior, and senior years than groups who have not received vocabulary training.

          The Human Engineering Laboratory, an institution devoted to the investigation of people's aptitudes, tested the vocabularies of 100 young men in the graduating class of the Business School of a large university. Five years later, a survey of the careers of these 100 students revealed this spectacular pair of statistics: (1) every senior who had scored in the upper 10 percent of the group had become an executive; (2) not a single young man whose score was in the lowest 25 percent had attained an executive position.

          The Laboratory, after testing the vocabularies of thousands of people in all age groups and in all walks of life, found that *the only common characteristic of successful people in this country was an unusual grasp of the meanings of words;* that the men and women drawing the highest salaries consistently made the highest scores. Consider very thoughtfully the explanation offered by Dr. Johnson O'Connor, director of the Laboratory:

          "Why do large vocabularies characterize executives and possibly outstanding men and women in other fields? The final answer seems to be that words are the instruments by means of which men and women grasp the thoughts of others and with which they do much of their own thinking. They are the tools of thought."

          The pages that follow will blueprint for you the most effective and productive techniques for permanently increasing your stock of the instruments of thinking and for sharpening your ability to grasp the thoughts of others. They will show you how to become more persuasive.

          Systematically increasing your vocabulary, you will discover, can bring you unexpected dividends of personal satisfaction and self-fulfillment; it can be pleasurable and exciting perhaps beyond your fondest hopes.
