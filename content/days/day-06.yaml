  - kind: "text"
    id: "d06-screen-say-it-aloud"
    title: "Say It Aloud"
    cards:
      - title: "Say It Aloud"
        body: |-
          Knowing the correct forms is only half the battle in your conquest of pronunciation demons. The other, and possibly more important, half is developing the habit of *using* the correct forms without hesitation whenever you speak. An awareness that the first *A* of *radiator* is pronounced as it is in *bay*, or that *mischievous* has three syllables rather than four, is of little benefit if you still unthinkingly say RAD'-ee-ay-tər and miss-CHEE'-vee-əs in your everyday conversation. Only practice will permanently root these mispronunciations out of your speech. So say these words several times aloud, hear them correctly in your own voice, push them deep into your consciousness.

          1. radiator — RAY'-dee-ay-tər
          2. mischievous — MISS'-chə-vəs
          3. genuine — JEN'-yoo-in
          4. comparable — KOM'-pə-rə-bəl
          5. chiropodist — kə-ROP'-ə-dist
          6. human — HYOO'-mən
          7. impotent — IM'-pə-tənt
          8. accessory — ak-SESS'-ər-ee
          9. orgy — OR'-jee

          So far you have been practicing the correct sounds of these tricky demons with a proper wariness and a certain self-consciousness. Suppose you were uttering the words casually in conversation; would you unhesitatingly avoid the pitfalls? Let us see. Read these phrases aloud, quickly and naturally—and, of course, correctly.

          - a hot radiator
          - human mischievousness
          - genuine impotence
          - incomparably skillful chiropodist
          - wild orgies
          - optional accessories
  - kind: "text"
    id: "d06-screen-watch-accent"
    title: "Watch Your Accent"
    cards:
      - title: "Watch Your Accent"
        body: |-
          Each of the nine words covered up to this point serves as a warning sign of a kind of error effective speakers have learned to avoid.

          *Comparable*, for example, is one of a group of demons ending in *-able* that cause the most plaguing type of accent trouble. Your final and complete conquest of this group will require patience and tenacity. Accenting the indicated syllable may at first seem almost superhumanly difficult; but it will become gradually easier with practice. Listen to yourself carefully, or ask a friend to listen to you, as you say the following words aloud; make sure you are accenting the capitalized syllable and not the one after it.

          1. COM'-parable
          2. PREF'-erable
          3. AM'-icable
          4. HOS'-pitable
          5. AD'-mirable
          6. LAM'-entable
          7. EX'-plicable
          8. AP'-plicable
          9. FOR'-midable
          10. REP'-utable
          11. DES'-picable

          In other forms of these words, the accent remains on the same syllable: *in*-COM'-*parable*, *in*-HOS'-*pitable*, *dis*-REP'-*utable*, COM'-*parability*, etc.

          The one exception to the group, *disputable*, may be pronounced with the accent either on the first or on the second syllable: DIS'-*putable* or *dis*-PU'-*table*. So also the negative form: *in*-DIS'-*putable* or *indis*-PU'-*table*.

          When you are sure you have all these words under effortless control, try reading these phrases aloud. Can you, without any great difficulty, keep the accent where it belongs?

          - admirable results
          - amicable settlement
          - lamentable error
          - despicable dishonesty
          - applicable examples
