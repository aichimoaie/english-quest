# Day 2: Test Your Vocabulary.
# Structure follows Part I, Day 2 of the reference book (learning goals and
# progression only). All words, items, answers and explanations are original.
# Status: draft until a human reviewer approves it (PRD section 11).
day: 2
title: "Test Your Vocabulary"

lessons:
  - id: d02-lesson-meaning-clues
    learning_area: Vocabulary
    title: "Find meaning from clues"
    cards:
      - title: Match a word to its meaning
        body: "A good vocabulary means you know what a word means, not only how it looks. Read the word, think of a situation where you would use it, then choose the meaning that fits."
        examples:
          - "A lucid explanation is clear, so you can follow it easily."
        watch_out: "Do not choose a meaning only because the word looks similar to something you know."
      - title: Similar or opposite
        body: "Many words come in pairs of similar and opposite meanings. Frugal means careful with money, so its opposite is extravagant, and its similar word is thrifty."
        examples:
          - "A frugal shopper compares prices before buying."
          - "An extravagant gift costs far more than planned."
        watch_out: "Check whether the question asks for a similar word or an opposite word."
      - title: Judge a statement with a word
        body: "Some sentences use a word correctly and some use it wrongly. Read the whole sentence, then decide whether the word's meaning makes sense in it."
        examples:
          - "An austere room has few decorations, so it is plain."
        watch_out: "A word can be correct in one sentence and wrong in another."

vocabulary:
  - word: wary
    definition: cautious, because you expect something bad might happen
    example: Stay wary of offers that sound too good to be true.
    audio_ref: d02-vocab-wary
  - word: frugal
    definition: careful with money and not wasteful
    example: Her frugal habits helped her save for a flat.
    audio_ref: d02-vocab-frugal
  - word: lucid
    definition: clear and easy to understand
    example: The teacher gave a lucid explanation of the rule.
    audio_ref: d02-vocab-lucid
  - word: tenacious
    definition: refusing to give up, even when things are difficult
    example: The tenacious runner finished the race despite the rain.
    audio_ref: d02-vocab-tenacious
  - word: ephemeral
    definition: lasting for only a very short time
    example: The rainbow was ephemeral and faded in minutes.
    audio_ref: d02-vocab-ephemeral
  - word: benevolent
    definition: kind, and wanting to help other people
    example: The benevolent doctor treated patients for free.
    audio_ref: d02-vocab-benevolent
  - word: austere
    definition: plain and simple, without luxury or decoration
    example: The monastery had an austere dining hall.
    audio_ref: d02-vocab-austere
  - word: cogent
    definition: clear, logical and convincing
    example: She made a cogent case for the new plan.
    audio_ref: d02-vocab-cogent
  - word: prudent
    definition: sensible and careful about risks
    example: It is prudent to check the weather before a hike.
    audio_ref: d02-vocab-prudent
  - word: meticulous
    definition: very careful about small details
    example: He kept meticulous notes on every experiment.
    audio_ref: d02-vocab-meticulous

exercises:
  # Match each word to its meaning (book section: Test 5, matching).
  - id: d02-match-01
    type: vocabulary_matching
    learning_area: Vocabulary
    origin: original
    topics: [vocabulary.word_meanings]
    difficulty: 2
    points: 1
    prompt: "Match each word with its meaning."
    pairs:
      - word: wary
        meaning: cautious about possible danger
      - word: frugal
        meaning: careful with money
      - word: lucid
        meaning: clear and easy to follow
      - word: tenacious
        meaning: refusing to give up
      - word: ephemeral
        meaning: lasting only briefly
    explanation: "Lucid means clear, and each of the other four words has exactly one matching meaning."

  - id: d02-match-02
    type: vocabulary_matching
    learning_area: Vocabulary
    origin: original
    topics: [vocabulary.word_meanings]
    difficulty: 2
    points: 1
    prompt: "Match each word with its meaning."
    pairs:
      - word: benevolent
        meaning: kind and wanting to help
      - word: austere
        meaning: plain, without luxury
      - word: cogent
        meaning: clear and convincing
      - word: prudent
        meaning: sensible about risks
      - word: meticulous
        meaning: very careful about details
    explanation: "Prudent and careful sound alike, but prudent is about judging risks, while meticulous is about small details."

  # Similar or opposite meaning (book section: Test 6, similar/opposite).
  - id: d02-sim-opp-01
    type: multiple_choice
    learning_area: Vocabulary
    origin: original
    topics: [vocabulary.antonyms]
    difficulty: 2
    points: 1
    prompt: "Which word is the opposite of frugal?"
    choices: ["extravagant", "thrifty", "careful"]
    answer: "extravagant"
    explanation: "Extravagant means spending too much, the reverse of frugal. Thrifty and careful are similar."

  - id: d02-sim-opp-02
    type: multiple_choice
    learning_area: Vocabulary
    origin: original
    topics: [vocabulary.synonyms]
    difficulty: 2
    points: 1
    prompt: "Which word is similar in meaning to tenacious?"
    choices: ["persistent", "careless", "timid"]
    answer: "persistent"
    explanation: "Persistent means continuing firmly, which is close to tenacious."

  - id: d02-sim-opp-03
    type: multiple_choice
    learning_area: Vocabulary
    origin: original
    topics: [vocabulary.antonyms]
    difficulty: 2
    points: 1
    prompt: "Which word is the opposite of benevolent?"
    choices: ["malicious", "generous", "gentle"]
    answer: "malicious"
    explanation: "Malicious means wanting to harm others, the reverse of benevolent."

  - id: d02-sim-opp-04
    type: multiple_choice
    learning_area: Vocabulary
    origin: original
    topics: [vocabulary.synonyms]
    difficulty: 2
    points: 1
    prompt: "Which word is similar in meaning to prudent?"
    choices: ["sensible", "reckless", "nervous"]
    answer: "sensible"
    explanation: "Sensible and prudent both describe good judgment. Reckless is the opposite."

  - id: d02-sim-opp-05
    type: multiple_choice
    learning_area: Vocabulary
    origin: original
    topics: [vocabulary.antonyms]
    difficulty: 2
    points: 1
    prompt: "Which word is the opposite of ephemeral?"
    choices: ["permanent", "fleeting", "brief"]
    answer: "permanent"
    explanation: "Permanent means lasting forever. Fleeting and brief are similar to ephemeral."

  - id: d02-sim-opp-06
    type: multiple_choice
    learning_area: Vocabulary
    origin: original
    topics: [vocabulary.synonyms]
    difficulty: 2
    points: 1
    prompt: "Which word is similar in meaning to cogent?"
    choices: ["persuasive", "vague", "rude"]
    answer: "persuasive"
    explanation: "A persuasive argument is convincing, as a cogent one is."

  - id: d02-sim-opp-07
    type: multiple_choice
    learning_area: Vocabulary
    origin: original
    topics: [vocabulary.antonyms]
    difficulty: 2
    points: 1
    prompt: "Which word is the opposite of meticulous?"
    choices: ["careless", "careful", "precise"]
    answer: "careless"
    explanation: "Careless means not paying attention to details, the reverse of meticulous."

  - id: d02-sim-opp-08
    type: multiple_choice
    learning_area: Vocabulary
    origin: original
    topics: [vocabulary.synonyms]
    difficulty: 2
    points: 1
    prompt: "Which word is similar in meaning to austere?"
    choices: ["severe", "lavish", "warm"]
    answer: "severe"
    explanation: "Severe means strict and plain, close to austere. Lavish is the opposite."

  - id: d02-sim-opp-09
    type: multiple_choice
    learning_area: Vocabulary
    origin: original
    topics: [vocabulary.antonyms]
    difficulty: 3
    points: 1
    prompt: "Which word is the opposite of wary?"
    choices: ["trusting", "careful", "anxious"]
    answer: "trusting"
    explanation: "Trusting means believing people will not harm you, the reverse of wary."

  - id: d02-sim-opp-10
    type: multiple_choice
    learning_area: Vocabulary
    origin: original
    topics: [vocabulary.synonyms]
    difficulty: 1
    points: 1
    prompt: "Which word is similar in meaning to wary?"
    choices: ["cautious", "reckless", "generous"]
    answer: "cautious"
    explanation: "Cautious means careful about possible danger, which is the same as wary."

  # Right or wrong statement (book section: Test 7, true/false).
  - id: d02-judge-01
    type: multiple_choice
    learning_area: Vocabulary
    origin: original
    topics: [vocabulary.word_use]
    difficulty: 1
    points: 1
    prompt: "Is this statement true? A frugal person spends money carelessly."
    choices: ["True", "False"]
    answer: "False"
    explanation: "A frugal person is careful with money, so the statement is false."

  - id: d02-judge-02
    type: multiple_choice
    learning_area: Vocabulary
    origin: original
    topics: [vocabulary.word_use]
    difficulty: 1
    points: 1
    prompt: "Is this statement true? A lucid explanation is easy to follow."
    choices: ["True", "False"]
    answer: "True"
    explanation: "Lucid means clear, so a lucid explanation is easy to follow."

  - id: d02-judge-03
    type: multiple_choice
    learning_area: Vocabulary
    origin: original
    topics: [vocabulary.word_use]
    difficulty: 2
    points: 1
    prompt: "Is this statement true? An ephemeral flower lasts for many years."
    choices: ["True", "False"]
    answer: "False"
    explanation: "Ephemeral means lasting only briefly, so an ephemeral flower does not last for years."

  - id: d02-judge-04
    type: multiple_choice
    learning_area: Vocabulary
    origin: original
    topics: [vocabulary.word_use]
    difficulty: 2
    points: 1
    prompt: "Is this statement true? A tenacious athlete gives up after the first loss."
    choices: ["True", "False"]
    answer: "False"
    explanation: "Tenacious means refusing to give up, so the statement is false."

  - id: d02-judge-05
    type: multiple_choice
    learning_area: Vocabulary
    origin: original
    topics: [vocabulary.word_use]
    difficulty: 1
    points: 1
    prompt: "Is this statement true? Benevolent people want to help others."
    choices: ["True", "False"]
    answer: "True"
    explanation: "Benevolent means kind and wanting to help, so the statement is true."

  - id: d02-judge-06
    type: multiple_choice
    learning_area: Vocabulary
    origin: original
    topics: [vocabulary.word_use]
    difficulty: 2
    points: 1
    prompt: "Is this statement true? An austere room is full of decoration and luxury."
    choices: ["True", "False"]
    answer: "False"
    explanation: "Austere means plain and simple, the reverse of a room full of decoration."
