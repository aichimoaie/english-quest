# Day 2: Test Your Vocabulary.
# Source: reference book, Second Day (pp. 18-23).
# Transcribed from pages/page20.md through page23.md, in the book's order.
# Imported verbatim at the owner's written instruction. The owner confirmed the rights to this text.
# This departs from the content rule in content/README.md ("Original wording only").
# App fields the book does not supply (difficulty, topics, points, vocabulary definition, example,
# audio_ref) were added for this app. origin is "original" only because the schema requires that value.
# Test 5 lists ten meanings with distractors. The schema allows at most six pairs per exercise, so
# Test 5 is split into two matching exercises (items 1-5 and 6-10) with the book's correct pairs.
# The book's pencil-margin annotations on pages 20-23 were not part of the printed text and are omitted.
# Status: draft until a human reviewer approves it (PRD section 11).
day: 2
title: "Test Your Vocabulary"

lessons:
  - id: d02-lesson-introduction
    learning_area: Vocabulary
    title: "Test Your Vocabulary"
    cards:
      - title: "Second Day: Test Your Vocabulary"
        body: |-
          React to 30 specially selected words to discover whether your vocabulary is average, good, or superior.

          *DOES YOUR VOCABULARY REFLECT YOUR MENTAL STATURE?*

          It was discovered some years ago that one particular ability was common to all successful business executives. At the Human Engineering Laboratory, then affiliated with the Stevens Institute of Technology in New Jersey, aptitude tests were administered to thousands of adults from every walk of life. Without exception, the top names showed the greatest skill in just one field—*vocabulary.* And, again without exception, everyone who had an extensive vocabulary also held a high position in his chosen field.

          Surprisingly, formal education turned out to have less relationship to the vocabulary score than might reasonably be expected. One man, a major executive of the telephone company, made a better showing than any of the college professors who had taken the tests. *And this man had left school at the age of 14!*

  - id: d02-lesson-vocabulary-tests
    learning_area: Vocabulary
    title: "The three vocabulary tests"
    cards:
      - title: "Second Day"
        body: |-
          The three tests that follow will show you whether your vocabulary is average, good, or superior.
      - title: "Test 5: Do You Have an Average Vocabulary?"
        body: |-
          If so, you will have no difficulty matching the two columns below. Seventy-five percent of the adults tested knew all these words.
      - title: "Test 6: Do You Have a Good Vocabulary?"
        body: |-
          Decide whether words and meanings are similar or opposite, and check the correct box. Only 49 percent of the adults tested knew these words. You have a good vocabulary if you can get at least eight right.
      - title: "Test 7: Do You Have a Superior Vocabulary?"
        body: |-
          Determine which of the following statements are true, which false, and check the proper box. Only 22 percent of the adults tested knew these words, so yours is a superior vocabulary if you can react correctly to eight or more.

vocabulary:
  - word: imminent
    definition: "likely to happen in the near future (Test 5, item 1)"
    example: "The book gives no example sentence for this word."
    audio_ref: d02-vocab-imminent
  - word: latent
    definition: "hidden (Test 5, item 6)"
    example: "The book gives no example sentence for this word."
