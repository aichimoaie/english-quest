  - kind: "text"
    id: "d09-screen-its-murder"
    title: "I. It's Murder!"
    cards:
      - title: "It's Murder!"
        body: |-
          Killing anyone is generally illegal, usually unethical, and almost always unpleasant. But murder goes back at least as far as Cain and Abel and even in the most civilized of countries is always part of the current scene.

          Here are 10 of the most popular victims of murder in one column, and the words that identify the type of killing in another column. How successfully can you match the word with the deed?

          1. whole groups of races of people
          2. one's mother
          3. one's father
          4. one's brother
          5. one's sister
          6. either parent or anyone in a parental capacity
          7. one's king
          8. any human being
          9. one's wife
          10. worms, especially the intestinal, parasitic variety

          Options: (a) sororicide, (b) uxoricide, (c) vermicide, (d) homicide, (e) parricide, (f) fratricide, (g) genocide, (h) patricide, (i) regicide, (j) matricide

          **KEY:** 1-g, 2-j, 3-h, 4-f, 5-a, 6-e, 7-i, 8-d, 9-b, 10-c.
  - kind: "text"
    id: "d09-screen-illogical"
    title: "II. Illogical Expressions"
    cards:
      - title: "Illogical Expressions"
        body: |-
          - COMMENCEMENT comes at the END of a college course.
          - We SAIL to Europe by STEAMship.
          - Some airplanes can LAND on WATER.
          - A hospital is MANNED by WOMEN.
          - What was in yesterday's paper is OLD NEWS.
          - Something GROWS SMALLER.
  - kind: "text"
    id: "d09-screen-most-mispronounced"
    title: "III. The 13 Words Most Often Mispronounced"
    cards:
      - title: "The 13 Words Most Often Mispronounced"
        body: |-
          There are many hundreds of thousands of words in our language—and though few of us know or use all of them, it is likely that thousands of different ones pass our lips in a week's conversation.

          Here's what is startling—out of these thousands of words in daily use, exactly 13 are more frequently mispronounced by the average speaker than any other words, common or uncommon, in the entire English language.

          This statistic has been discovered through investigations made in vocabulary-improvement classes in the Division of General Education of New York University; and term after term, with different students, the result is confirmed—it's always the same thirteen words that cause the most trouble.

          You will find this most-sinned-against baker's dozen of English words on the next page—and a chance to find out whether you tend to make the same mistakes as most other people. Check the pronunciation you honestly and habitually use, then compare your results with the key below. If you're average, you should get no more than 4 or 5 right; 6 to 8 correct choices will indicate a high degree of linguistic sophistication; 9 to 12 will mean that your command of English is remarkable; and a perfect score will mark you as unique, no less.

          1. orgy (drunken revelry) — (a) OR'-jee; (b) OR'-gee
          2. human — (a) YOO'-mən; (b) HYOO'-mən
          3. forte (strong point) — (a) FOR'-tay; (b) FORT
          4. genuine — (a) JEN'-yoo-win; (b) JEN'-yoo-wine
          5. acumen (mental keenness) — (a) ə-KYOO'-mən; (b) AK'-yoo-mən
          6. admirable — (a) ad-MIRE'-ə-bəl; (b) AD'-mə-rə-bəl
          7. mischievous — (a) mis-CHEE'-vee-əs; (b) MIS'-chə-vəs
          8. radiator — (a) RAY'-dee-ay-tər; (b) RAD'-ee-ay-tər
          9. grimace (facial contortion) — (a) grə-MAYCE'; (b) GRIM'-ass
          10. impious (against religion) — (a) im-PYE'-əs; (b) IM'-pee-əs
          11. finis (the end) — (a) fee-NEE'; (b) FIN'-iss; (c) FYE'-niss
          12. naïveté (artlessness) — (a) NAY'-və-tee; (b) nah-eev-TAY'; (c) nay-VET'
          13. integral (essential) — (a) IN'-tə-grəl; (b) in-TEG'-rəl; (c) in-TEE'-grəl

          **KEY:** 1-a, 2-b, 3-b, 4-a, 5-a, 6-b, 7-b, 8-a, 9-a, 10-b, 11-c, 12-b, 13-a.
