day: 9
title: "Just for Fun (II)"
objective: "Have fun with tricky words and find out what kind of speller you are."

vocabulary:
  - word: "fratricide"
    definition: "the killing of one's brother or sister"
    example: "The novel describes a fratricide between two brothers."
    audio_ref: "d09-vocab-fratricide"
  - word: "matricide"
    definition: "the killing of one's mother"
    example: "Matricide is one of the most serious crimes in the story."
    audio_ref: "d09-vocab-matricide"
  - word: "regicide"
    definition: "the killing of a king"
    example: "The play is about a regicide that changed the country."
    audio_ref: "d09-vocab-regicide"
  - word: "genocide"
    definition: "the killing of whole groups of people of one race or nation"
    example: "The court studied the history of the genocide."
    audio_ref: "d09-vocab-genocide"
  - word: "vermicide"
    definition: "a substance that kills worms, especially intestinal parasites"
    example: "The farmer bought a vermicide for the sick sheep."
    audio_ref: "d09-vocab-vermicide"

