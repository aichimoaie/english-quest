    title: "A few roots unlock the secrets of hundreds of words"
    cards:
      - title: "A few roots unlock the secrets of hundreds of words"
        body: |-
          So far we have made contact with 20 extremely productive Latin and Greek roots and intensively studied 20 English words and some of their derivative forms. In our quick excursions into roots, however, we noticed in passing another 20 or so words, many of them perhaps quite new to you — and yet we have hardly begun to tap the rich resources of the roots we've uncovered.

          You can take the most complex words, and any number of them, and if you can recognize the roots on which they're built you will have no difficulty understanding them, remembering them, and keeping them unconfused in your mind. By becoming familiar with the common roots we've discussed, you have taken a giant step forward in building a larger and more meaningful vocabulary, *for you are now able to figure out hundreds of words that you may never have seen or heard of before.*

          So at this point let us take another quick look at some of the roots we've been working with and see how easy it is to discover 27 additional words, even though we'll hardly do much more than scratch the surface of the possibilities.

          Doesn't recognizing the root in the following words make them immediately understandable and almost absurdly simple to remember?

          **1. *ped-* means *foot***

          **centipede** A wormlike creature that seems to have a hundred feet, which is, of course, an exaggeration.

          **velocipede** A child's tricycle propelled by speedy feet.

          **2. *bi-* means *two***

          **bisect** To cut into two equal parts.

          **bilingual** Able to speak two languages.

          **biennial** Every two years.

          **bilateral** Having, or involving, two sides.

          **3. *tri-* means *three***

          **triplets** Three children at a single birth.

          **trisect** To cut into three equal parts.

          **trilingual** Able to speak three languages.

          **triennial** Every three years.

          **4. *quadr-* means *four***

          **quadruplets** Four children at a single birth.

          **quadrennial** Every four years.

          **quadrisyllable** A word of four syllables.

          **5. *ortho-* means *straight, correct***

          **orthodontia** The branch of dentistry dealing with straightening the teeth, correcting the bite, etc.

          **orthography** Correct writing, hence the system of spelling a language.

          **6. *agogos* means *leader***

          **demagogue** One who pretends to be a leader of the people but in actuality foments discontent among the masses in order to gain power.

          **synagogue** Jewish temple in which people are led or brought together to worship God.

          **7. *anthrop-* means *mankind***

          **anthropoid** Similar to man in form or appearance, as the anthropoid apes.

          **8. *theos* means *god***

          **theology** The study of God or religion.

          **monotheism** Belief in one God.

          **atheism** Complete disbelief in the existence of God.

          **9. *phil-* means *love***

          **Philadelphia** The city of brotherly love.

          **philology** The love of words, hence the science of language.

          **philter** A love potion.

          **philander** To make love trifingly and insincerely.

          **bibliophile** One who loves books; also, a collector of books.

          **philatelist** A stamp collector; one who loves stamps.

          Some of these words are commonly mispronounced. To give you greater assurance in using them, practice aloud the pronunciations given below.

          velocipede: və-LOS'-ə-peed
          orthodontia: awr'-thə-DON'-shə
          orthography: awr-THOG'-rə-fee
          demagogue: DEM'-ə-gog
          theology: thee-OL'-ə-jee
          monotheism: MON'-ə-thee-iz-əm
          atheism: AY'-thee-iz-əm
          philology: fə-LOL'-ə-jee
          philander: fə-LAN'-dər
          bibliophile: BIB'-lee-ə-file
          philatelist: fə-LAT'-ə-list
  - kind: "text"
    id: "d11-screen-tie-it-up"
    title: "Let's tie it all up"
    cards:
      - title: "Let's tie it all up"
        body: |-
          In the short time it took you to cover the material in this chapter you have either learned for the first time, or become reacquainted with on a deeper level, approximately 67 expressive and highly useful English words — more than the average adult learns in two years. More important, you have come to realize that words, like people, grow in families, and that the parent in these families is often a Greek or Latin root.

          When you have control of a root you are in command of scores of words, you can figure out the meanings of words you may never have seen before, you understand words more fully, you know why a word means what it does.

          And from now on you will probably note a curious phenomenon. The words you have studied today will begin to appear over and over again in your reading — not because they have suddenly become popular, but because you have an understanding of them that will make them doubly conspicuous, and considerably more meaningful, every time you meet them.

          *Very soon, and this you will shortly discover for yourself, you will begin to use these new words — and without hesitation or self-consciousness.*

          So now, to wrap it all up in a neat little package, are you ready to try a simple test on the word roots we've studied? Here are 20 of our words chosen at random from the 67 we've worked with. In each, a single root is italicized. Can you write the English meaning of each root in the blank provided?

          Words with the target root italicized (root bolded here for clarity): 1. ex**ped**itious, 2. **ped**agogy, 3. **mon**ogamy, 4. poly**glot**, 5. mis**ogyn**y, 6. **ped**iatrics, 7. **pod**iatry, 8. **bi**lingual, 9. **tri**ennial, 10. **chiro**podist, 11. dem**agog**ue, 12. mis**anthrop**y, 13. poly**theos** [poly*theism*], 14. **phil**anthropy, 15. **ortho**pedics, 16. **theos**logy [the**olog**y], 17. **quadr**uped, 18. **psych**iatry, 19. poly**gam**y, 20. **gyn**ecology

          KEY: 1-foot, 2-child, 3-one, 4-tongue, language, 5-hatred, 6-medical treatment, 7-foot, 8-two, 9-three, 10-hand, 11-to lead, 12-mankind, 13-many, 14-love, 15-straight, correct, 16-god, 17-four, 18-mind, 19-marriage, 20-woman.
