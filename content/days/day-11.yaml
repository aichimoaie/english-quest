  - kind: "text"
    id: "d11-screen-another-kind-of-ped"
    title: "Another kind of 'ped-'"
    cards:
      - title: "Another kind of 'ped-'"
        body: |-
          There is no more effective means of learning new words quickly, permanently, and in wholesale quantities than by seeing how they occur in related families. By examining the *ped-* and *pod-* families, you have, in a few minutes, made a strong and lasting contact with ten valuable words and, in addition, have learned six useful new roots. Now let us look at another *ped-* family, one that comes to us not from Latin *pedis* but from Greek *paidos*.

          Greek *paidos* means *child*. In English words built on *paidos*, the root is again spelled *ped-*, though this syllable has no relation, despite its identical appearance, to Latin *ped-*, foot. For example:

          **pediatrics** The medical specialty of children's diseases. The doctor is a *pediatrician*.
          ▶ Once again, our friend *iatr-*, medical treatment.

          **pedagogy** The science, art, or principles of teaching.
          ▶ This word combines *paidos*, child, with the Greek noun *agogos*, leader, from the verb *agein*, to lead — hence . . . *children*.

          **pedagogue** A teacher, usually one who is stuffy, excessively precise, or dogmatic.
          ▶ The word is not a bit complimentary and indicates our irritation with teachers who flaunt their learning in correcting our errors.

          **orthopedics** The medical specialty dealing with bones and joints. Broken legs, curvature of the spine, club foot, and other skeletal injuries or deformities are the province of the *orthopedist* or *orthopedic surgeon*.
          ▶ This word combines *paidos*, child, and the root *ortho-*, straight or correct, the idea being that a child's bones are more pliable and hence more easily straightened, corrected, or mended than those of an adult, though of course an orthopedist does not by any means limit his practice to children.
  - kind: "text"
    id: "d11-screen-new-roots"
    title: "New roots lead to new words"
    cards:
      - title: "New roots lead to new words"
        body: |-
          Building your vocabulary through an exploration of word roots is not only amazingly simple, rapid, and effective, but also remarkably productive. An excursion into one family of words automatically turns up new families that promise endless and exciting discoveries, as you have already seen.

          Starting with Latin *pedis*, you were soon involved with Greek *podis* and *paidos*. You learned, or became reacquainted with, a score of vital, useful words and discovered new roots that unlocked still more words to add to your vocabulary.

          Suppose, therefore, we continue the process of letting roots lead to new words, which in turn lead to new roots, which in turn . . . etc., by looking once again at *bi-*.

          **1. *bi-* means *two*.**

          **bigamy** *Two* marriages. The bigamist takes a second wife or husband while a previous union is still in effect. The adjective is *bigamous*.
          ▶ So *gam-* must mean *marriage*. Let us see what interesting words this new root leads us to.

          **2. *gam-* means *marriage*.**

          **monogamy** The system of only one marriage at a time. The adjective is *monogamous*.
          ▶ So *mon-* must mean *one*, as in *monocle*, a lens for one eye, and *monarch*, the one supreme ruler of a nation. Knowing the meaning of *mon-*, can you figure out *monologue*, *monotheism*, *monosyllable*?

          **polygamy** The custom permitting a man many wives (or marriages), once practiced by the Mormons in Utah. The adjective is *polygamous*.
          ▶ So *poly-* must mean *many*, as in *polygon*, a geometric figure of many sides. Can you, then, figure out *polysyllable*, *polyglot* (*glot-* means tongue or language), *polytheism* (*theos* means god)?

          **misogamy** The hatred of marriage. The adjective is *misogamous*; the hater is a *misogamist*.
          ▶ So *mis-* (from Greek *misein*) must mean *hatred*.

          **3. *mis-* (Greek *misein*) means *hatred*.**

          **misanthropy** The hatred of all mankind. The person who hates everyone is a *misanthrope*. The adjective is *misanthropic*.
          ▶ So *anthrop-* must mean *mankind*, as in *anthropology*, the science of mankind's development, and *philanthropy*, the love of mankind (*phil-* means love).

          **misogyny** The hatred of women. A *misogynist* hates all females, usually for dark reasons that only a psychiatrist can unravel. The adjective is *misogynous*.
          ▶ So *gyn-* must mean *woman*, as in *gynecology*, the medical study of ailments peculiar to women.
