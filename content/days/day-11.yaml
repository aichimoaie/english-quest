screens:
  - kind: "text"
    id: "d11-screen-introduction"
    title: "The Royal Road to Learning New Words"
    cards:
      - title: "Eleventh Day"
        body: |-
          *If you work from Latin and Greek roots you can add new words to your vocabulary in wholesale quantities!*

          One of the quickest, surest, and most permanent methods of increasing your vocabulary is to study groups of words containing a common root.

          For example, Latin *pedis* means *foot*, and as a root is spelled *ped-* in such words as *pedestrian* (someone who goes on foot, or, as the joke goes, a motorist who has finally found a parking place); *pedal* (a lever controlled by the foot); and *pedestal* (the foot or base of a column or statue). Knowing that the English syllable *ped-* has some relationship to *foot*, you can easily understand, and even more easily remember, the following important words:

          **biped** A creature with two *feet*. Man is a *biped*; birds are also *bipeds*.
          ▶ So the root *bi-* must mean *two*, as also in *bicycle*, a two-wheeled vehicle.

          **quadruped** A creature with four *feet*. Dogs, cats, lions, tigers, and most other mammals are *quadrupeds*.
  - kind: "text"
    id: "d11-screen-another-way-of-saying-foot"
    title: "Another way of saying 'foot'"
    cards:
      - title: "Another way of saying 'foot'"
        body: |-
          ▶ So the root *quadr-* must mean *four*, as also in *quadrilateral*, a geometric figure with four sides.

          **impede** To hinder the progress of, get in the way of.

          **impediment** A hindrance or obstruction, something that gets in the way of progress. A speech *impediment*, such as a stammer or stutter, gets in the way of fluency, almost as if one spoke with one's foot in one's mouth!
          ▶ Thus, to *impede* is to tangle up someone's feet so that progress is difficult or impossible.

          **expedite** The opposite of *impede*, this verb means to speed or facilitate the progress of: the road was widened to *expedite* traffic.
          ▶ To *expedite* is, therefore, to free the feet for easy and rapid progress.

          **expeditious** Rapid, prompt, without delay: the *expeditious* movements of goods and mail by airplane.

          *Biped, quadruped, impede,* and *expedite* are all built on the root *ped-*, from Latin *pedis*, foot. The Greeks also had a word for foot: *podis*, which occurs in English words as the root *pod-*. Consider, for example:

          **podiatrist** One who treats foot ailments, such as corns, calluses, fallen arches. The specialty is *podiatry*.
          ▶ Here we meet another new root, *iatr-*, medical treatment. *Podiatrists* are specialists in the medical treatment of feet, just as *psychiatrists* specialize in the medical treatment of the *psyche*, or mind.

          **chiropodist** This is an older term for *podiatrist*, the latter being the official designation. Most foot doctors put both titles on their shingles, and the two words have exactly the same meaning. The specialty is *chiropody*.
          ▶ *Chiropodist* combines *pod-*, foot, with the Greek *chiro-*, hand; in earlier days, this therapist treated hands as well as feet.

          **podium** A raised platform for a speaker or orchestra conductor.
          ▶ Thus, a *podium* is a base, or foot, on which to stand.

          **tripod** Any support with three legs (or feet), as for a camera.
          ▶ So *tri-* means *three*, as in *triangle* (a geometric figure with three angles), just as *bi-* means two and *quadr-* means four.
  - kind: "test"
    id: "d11-test-first-set"
    title: "Test Your Learning: first set"
    intro: |-
      Notice how simple it is to understand, and how effectively (and expeditiously!) you can remember, the words we have discussed when you see clearly how each one is built on the root *ped-* or *pod-*, when you sense the idea of "footness" in all of them. Now, to make these words a useful part of your vocabulary, to really nail them down as permanent acquisitions, try the exercises that follow.

      The first, and the most fruitful, step you can take in adding a word to your vocabulary is to understand, by knowing its root, why it means what it does. The next step is to become used to it, to get on relaxed and friendly terms with it by hearing it in your own voice. So say each word aloud, not once but several times, following carefully the phonetic spelling. In this way you not only make friends with a new word, but you also feel so at ease with it that it will pop up in your thinking and conversation without any conscious effort on your part.

      [The symbol ə indicates the very slight vowel sound heard in the first syllable of *commit* (kə-MIT') or the last syllable of *Linda* (LIN'-də). The accent mark (') shows stress, capitalized syllables receiving a stronger stress than those in lower case.]

      Say each word aloud, with its pronunciation:
      biped (BY'-ped)
      quadruped (KWAHD'-roo-ped)
      impede (im-PEED')
      impediment (im-PED'-ə-mənt)
      expedite (EKS'-pə-dite)
      expeditious (eks'-pə-DISH'-əs)
      podiatrist (pə-DY'-ə-trist)
      chiropodist (kə-ROP'-ə-dist)
      podium (PO'-dee-əm)
      tripod (TRY'-pod)
