day: 1
title: "Test Your Pronunciation"

lessons:
  - id: d01-lesson-introduction
    learning_area: Pronunciation
    title: "Test Your English!"
    cards:
      - title: "Test Your English!"
        body: |-
          Do you make embarrassing errors in pronunciation, spelling, grammar, word usage?

          Is your vocabulary fresh and growing, or do you use the same old tired words over and over?

          In short, does your English work for you or against you?

          *HERE'S YOUR CHANCE TO FIND OUT!*
      - title: "The words you use"
        body: |-
          The words you use can either work for you or against you—and, in a very real sense, you are the one who chooses which it's to be.

          For, rightly or wrongly, you are often judged not only by what you say but, more immediately, by how you say it. Your language, whether in speech or writing, announces to the world—to your friends, to your business or professional associates, indeed to everyone with whom you come in contact for no matter how brief a time—*this is the kind of person I am.*

          The relationships you have with other people are largely dependent on words—you communicate to others your feelings, your needs, your ideas, your reactions in words. *More important, you continuously present yourself in words.*
      - title: "What your words say about you"
        body: |-
          Just what kind of person do others see when you translate your thoughts into speech or writing? Part I will help you find out—will help you discover what your spelling, pronunciation, and grammar say about you.

  - id: d01-lesson-pronunciation
    learning_area: Pronunciation
    title: "Test Your Pronunciation"
    cards:
      - title: "First Day: Test Your Pronunciation"
        body: |-
          Four short, but revealing, pronunciation tests give you an accurate indication of how you sound to other people.

          *DOES YOUR PRONUNCIATION HELP YOU PUT YOUR BEST FOOT FORWARD?*

          In the following four tests, check in each instance the pronunciation you naturally and habitually use—do not be influenced by what you think may or may not be "correct."

          [The symbol ə indicates the very slight vowel sound heard in the first syllable of *commit* (kə-MIT') or the last syllable of *Linda* (LIN'-də)].

vocabulary:
  - word: epitome
    definition: "Book gives the pronunciation EP'-ə-tome (Test 3, item 1). No meaning is given in the book."
    example: "The book gives no example sentence for this word."
    audio_ref: d01-vocab-epitome

