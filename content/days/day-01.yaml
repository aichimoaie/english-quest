# Day 1: Greetings and the verb "be".
# Authored from scratch for English Quest. Not taken from any published book.
# Status: draft until a human reviewer approves it (PRD section 11).
day: 1
title: Greetings and the verb "be"

lessons:
  - id: d01-lesson-be
    learning_area: Grammar
    title: The verb "be" in the present
    cards:
      - title: Three forms of "be"
        body: The verb "be" has three present forms, am, is and are. Use it to say who someone is, where they are, or how they feel.
        examples:
          - "I am a cook."
          - "She is my neighbour."
          - "They are happy today."
      - title: Choose the right form
        body: Use "am" only with "I". Use "is" with he, she, it and one name or thing. Use "are" with you, we and they.
        examples:
          - "I am ready."
          - "Tom is at school."
          - "We are friends."
        watch_out: Do not say "I are" or "She am".
      - title: Make a sentence negative
        body: To make a sentence negative with "be", put "not" after the form of "be".
        examples:
          - "He is not tired."
          - "You are not late."

  - id: d01-lesson-greetings
    learning_area: Vocabulary
    title: Saying hello
    cards:
      - title: Greetings for any time of day
        body: '"Hello" and "Hi" work at any time. Use "Good morning" before noon, "Good afternoon" from noon to evening, and "Good evening" after dark.'
        examples:
          - "Hello, I am Sam."
          - "Good morning, how are you?"
        watch_out: Only "Good morning", "Good afternoon" and "Good evening" use "Good". "Hello" does not.
      - title: Answer "How are you?"
        body: A short answer is enough. "I am fine, thank you." and "I am tired today." are both natural.
        examples:
          - "I am fine, thank you."
          - "I am tired today."

vocabulary:
  - word: brother
    definition: a boy or man who has the same parents as you
    example: My brother is taller than me.
  - word: sister
    definition: a girl or woman who has the same parents as you
    example: My sister studies medicine in Bristol.
  - word: neighbour
    definition: a person who lives near your home
    example: Our neighbour has a small blue car.
  - word: grandmother
    definition: the mother of your mother or father
    example: My grandmother bakes bread on Sundays.
  - word: friend
    definition: a person you like and spend time with
    example: My friend and I play tennis on Fridays.
  - word: teacher
    definition: a person whose job is to teach
    example: Our teacher is patient with everyone.
  - word: student
    definition: a person who is learning at a school, college or university
    example: Each student has a notebook.
  - word: doctor
    definition: a person who treats sick people
    example: The doctor checked my throat.

exercises:
  - id: d01-grammar-mc-01
    type: multiple_choice
    learning_area: Grammar
    origin: original
    topics:
      - grammar.be.present
    points: 1
    prompt: "Choose the correct word: ___ you ready for the lesson?"
    choices:
      - Am
      - Is
      - Are
    answer: Are
    explanation: Use "are" with "you". Use "am" only with "I", and "is" with he, she or it.

  - id: d01-grammar-fill-01
    type: fill_blank
    learning_area: Grammar
    origin: original
    topics:
      - grammar.be.present
    points: 1
    prompt: "Fill in the blank: My cousin ___ twelve years old."
    accepted:
      - is
    explanation: "\"My cousin\" is one person, so the form is \"is\"."

  - id: d01-grammar-mc-02
    type: multiple_choice
    learning_area: Grammar
    origin: original
    topics:
      - grammar.be.negative
    points: 1
    prompt: Which sentence is correct?
    choices:
      - He not is tired.
      - He is not tired.
      - He is no tired.
    answer: He is not tired.
    explanation: With "be", put "not" after the verb, as in "is not". Never put "not" before the verb.

  - id: d01-listening-mc-01
    type: listening_comprehension
    learning_area: Listening
    origin: original
    topics:
      - listening.detail
    points: 1
    prompt: "Listen, then choose the answer: Where is Maria from?"
    audio_text: "Hello, my name is Maria. I am from Spain, and I am a nurse."
    choices:
      - Italy
      - Spain
      - Portugal
    answer: Spain
    explanation: Maria says "I am from Spain." Listen for the words that come after "I am from".

  - id: d01-pronunciation-01
    type: pronunciation_practice
    learning_area: Pronunciation
    origin: original
    topics:
      - pronunciation.vowel_length
    points: 1
    prompt: "Listen, then choose the sentence you hear."
    audio_text: "I have a sheep."
    choices:
      - I have a ship.
      - I have a sheep.
    answer: I have a sheep.
    explanation: "\"Sheep\" has a long vowel, as in \"see\". \"Ship\" has a short vowel, as in \"sit\"."

  - id: d01-pronunciation-self-01
    type: pronunciation_self_rating
    learning_area: Pronunciation
    origin: original
    topics:
      - pronunciation.vowel_length
    prompt: "Listen, say the sentence aloud, then rate how well you said the short and long vowels."
    audio_text: "Please sit in the seat."
    explanation: "\"Sit\" has a short vowel, as in \"sip\". \"Seat\" has a long vowel, as in \"see\". Listen again, then rate your own answer."

  - id: d01-vocabulary-match-01
    type: vocabulary_matching
    learning_area: Vocabulary
    origin: original
    topics:
      - vocabulary.family_and_people
    points: 4
    prompt: Match each word with its meaning.
    pairs:
      - word: brother
        meaning: a boy or man who has the same parents as you
      - word: neighbour
        meaning: a person who lives near your home
      - word: grandmother
        meaning: the mother of your mother or father
      - word: friend
        meaning: a person you like and spend time with
    explanation: Each word names a person in your life. Read the meanings again if you are unsure.

  - id: d01-sentence-order-01
    type: sentence_ordering
    learning_area: Sentence construction
    origin: original
    topics:
      - sentence.word_order.basic_clause
    points: 1
    prompt: Put the words in the correct order to make one sentence.
    tokens:
      - a
      - is
      - doctor.
      - brother
      - My
    answer:
      - My
      - brother
      - is
      - a
      - doctor.
    explanation: Start with the subject, "My brother". Then add the verb "is", and finish with "a doctor."

  - id: d01-spelling-01
    type: spelling_correction
    learning_area: Spelling
    origin: original
    topics:
      - spelling.double_letters
    points: 1
    prompt: One word is misspelled. Retype the whole sentence with the word fixed.
    text: We drink cofee in the morning.
    accepted:
      - We drink coffee in the morning.
    explanation: "\"Coffee\" has two f's and two e's. Say it in two parts: cof-fee."
