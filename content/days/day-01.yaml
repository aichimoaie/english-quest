# Day 1: Test Your Pronunciation.
# Structure follows Part I, Day 1 of the reference book (learning goals and
# progression only). All wording, items, answers and explanations are original.
# Pronunciation keys are written for this app. They are not copied from any book.
# Status: draft until a human reviewer approves it (PRD section 11).
day: 1
title: "Test Your Pronunciation"

lessons:
  - id: d01-lesson-stress
    learning_area: Pronunciation
    title: "Stress and the middle syllable"
    cards:
      - title: Stress makes a word easy to recognise
        body: "Each word with more than one syllable has one syllable said with more force. A word can be understood with a wrong vowel, but a wrong stress often sounds strange."
        examples:
          - "In pruh-nun-see-AY-shun the stress falls on the fourth syllable."
          - "Say eh-SPRES-oh, not ex-PRESS-oh, for espresso."
        watch_out: "Check the stressed syllable in dictionary respellings, which mark it with a capital."
      - title: Weak syllables are short and quiet
        body: "In many unstressed syllables the vowel becomes a short, quiet sound called schwa, written as ə in respellings. The middle syllable of library is often quiet."
        examples:
          - "LY-brer-ee has three syllables when spoken carefully."
        watch_out: "Do not drop a whole syllable just because it is quiet."

  - id: d01-lesson-sounds
    learning_area: Pronunciation
    title: "Silent letters and common mistakes"
    cards:
      - title: Some letters are silent
        body: "Some letters are written but not spoken. The h in hour is silent, the w in sword is silent, and the gh in height is silent, leaving a long i sound."
        examples:
          - "The hour passed quickly."
          - "She drew a sword in the play."
        watch_out: "Say the word you know, not the spelling you see."
      - title: Preferred pronunciations of common words
        body: "Say ask with a k sound before the s. Burglar has two syllables, not three, and mischievous has three syllables with the middle one quiet."
        examples:
          - "Please ask the teacher a question."
          - "The burglar was caught on camera."
        watch_out: "Do not add an extra syllable to mischievous."

vocabulary:
  - word: library
    definition: a room or building where books are kept for people to read or borrow
    example: I study at the library on Tuesdays.
    audio_ref: d01-vocab-library
  - word: espresso
    definition: strong coffee made by forcing hot water through finely ground beans
    example: He ordered a small espresso after dinner.
    audio_ref: d01-vocab-espresso
  - word: forehead
    definition: the front part of the head above the eyes
    example: She wiped the sweat from her forehead.
    audio_ref: d01-vocab-forehead
  - word: height
    definition: how tall a person or thing is
    example: What is the height of that tower?
    audio_ref: d01-vocab-height
  - word: burglar
    definition: a person who enters a building illegally to steal
    example: The police arrested the burglar at the door.
    audio_ref: d01-vocab-burglar
  - word: quinoa
    definition: a grain-like seed that is often eaten as a healthy side dish
    example: We had quinoa with roasted vegetables.
    audio_ref: d01-vocab-quinoa

exercises:
  # Common but glaring errors (book section: Test 1, pronunciation_choice).
  - id: d01-pron-common-01
    type: multiple_choice
    learning_area: Pronunciation
    origin: original
    topics: [pronunciation.common_errors]
    difficulty: 1
    points: 1
    prompt: "Which is the preferred pronunciation of library?"
    choices: ["LY-bree", "LY-brer-ee"]
    answer: "LY-brer-ee"
    explanation: "The careful pronunciation keeps the middle syllable, with a quiet vowel."

  - id: d01-pron-common-02
    type: multiple_choice
    learning_area: Pronunciation
    origin: original
    topics: [pronunciation.common_errors]
    difficulty: 1
    points: 1
    prompt: "Which is the preferred pronunciation of mischievous?"
    choices: ["MIS-chee-vee-us", "MIS-chuh-vus"]
    answer: "MIS-chuh-vus"
    explanation: "Mischievous has three syllables. The middle one is quiet."

  - id: d01-pron-common-03
    type: multiple_choice
    learning_area: Pronunciation
    origin: original
    topics: [pronunciation.common_errors]
    difficulty: 2
    points: 1
    prompt: "Which is the preferred pronunciation of supposedly?"
    choices: ["suh-POHS-ed-lee", "suh-POHZ-id-lee"]
    answer: "suh-POHZ-id-lee"
    explanation: "The s in the middle of the word is voiced, like a z, and the ending is -id-lee."

  - id: d01-pron-common-04
    type: multiple_choice
    learning_area: Pronunciation
    origin: original
    topics: [pronunciation.common_errors]
    difficulty: 2
    points: 1
    prompt: "Which is the preferred pronunciation of espresso?"
    choices: ["ex-PRESS-oh", "eh-SPRES-oh"]
    answer: "eh-SPRES-oh"
    explanation: "The stress falls on the second syllable, and the first vowel is quiet."

  - id: d01-pron-common-05
    type: multiple_choice
    learning_area: Pronunciation
    origin: original
    topics: [pronunciation.common_errors]
    difficulty: 1
    points: 1
    prompt: "Which is the preferred pronunciation of Wednesday?"
    choices: ["WED-nes-day", "WENZ-dee"]
    answer: "WENZ-dee"
    explanation: "Most speakers drop the middle syllable and say two syllables."

  # Preferred pronunciation for educated speakers (book section: Test 2).
  - id: d01-pron-educated-01
    type: multiple_choice
    learning_area: Pronunciation
    origin: original
    topics: [pronunciation.educated_standard]
    difficulty: 2
    points: 1
    prompt: "Which is the preferred pronunciation of height?"
    choices: ["HITE", "HYTE"]
    answer: "HYTE"
    explanation: "The vowel in height is the long i, as in high. The g is silent."

  - id: d01-pron-educated-02
    type: multiple_choice
    learning_area: Pronunciation
    origin: original
    topics: [pronunciation.educated_standard]
    difficulty: 2
    points: 1
    prompt: "Which is the preferred pronunciation of burglar?"
    choices: ["BUR-gu-lar", "BUR-glur"]
    answer: "BUR-glur"
    explanation: "Burglar has two syllables, and the final syllable is a quiet schwa."

  - id: d01-pron-educated-03
    type: multiple_choice
    learning_area: Pronunciation
    origin: original
    topics: [pronunciation.educated_standard]
    difficulty: 1
    points: 1
    prompt: "Which is the preferred pronunciation of ask?"
    choices: ["AKS", "ASK"]
    answer: "ASK"
    explanation: "The standard word has a k sound before the s. The form AKS is not standard."

  - id: d01-pron-educated-04
    type: multiple_choice
    learning_area: Pronunciation
    origin: original
    topics: [pronunciation.educated_standard]
    difficulty: 2
    points: 1
    prompt: "Which is the preferred pronunciation of picture?"
    choices: ["PIK-tyoor", "PIK-chur"]
    answer: "PIK-chur"
    explanation: "Picture has two syllables, and the ending is the sound chur."

  - id: d01-pron-educated-05
    type: multiple_choice
    learning_area: Pronunciation
    origin: original
    topics: [pronunciation.educated_standard]
    difficulty: 2
    points: 1
    prompt: "Which is the preferred pronunciation of athlete?"
    choices: ["ATH-uh-leet", "ATH-leet"]
    answer: "ATH-leet"
    explanation: "Athlete has two syllables. The second syllable is leet, with no extra uh sound before it."

  # Unknown words: check you know the correct pronunciation (book section: Test 3).
  - id: d01-pron-unknown-01
    type: multiple_choice
    learning_area: Pronunciation
    origin: original
    topics: [pronunciation.unknown_words]
    difficulty: 2
    points: 1
    prompt: "Which is the preferred pronunciation of gauge?"
    choices: ["GAW-uh-jee", "GAYJ"]
    answer: "GAYJ"
    explanation: "Gauge is one syllable with a long a and a j sound."

  - id: d01-pron-unknown-02
    type: multiple_choice
    learning_area: Pronunciation
    origin: original
    topics: [pronunciation.unknown_words]
    difficulty: 2
    points: 1
    prompt: "Which is the preferred pronunciation of quinoa?"
    choices: ["KWIN-oh-uh", "KEEN-wah"]
    answer: "KEEN-wah"
    explanation: "Quinoa is pronounced keen-wah in most English dictionaries."

  - id: d01-pron-unknown-03
    type: multiple_choice
    learning_area: Pronunciation
    origin: original
    topics: [pronunciation.unknown_words]
    difficulty: 3
    points: 1
    prompt: "Which is the preferred pronunciation of sumptuous?"
    choices: ["SUM-too-us", "SUMP-choo-us"]
    answer: "SUMP-choo-us"
    explanation: "The p is spoken, and the stressed syllable is the first one."

  - id: d01-pron-unknown-04
    type: multiple_choice
    learning_area: Pronunciation
    origin: original
    topics: [pronunciation.unknown_words]
    difficulty: 2
    points: 1
    prompt: "Which is the preferred pronunciation of chasm?"
    choices: ["CHAS-um", "KAZ-um"]
    answer: "KAZ-um"
    explanation: "The ch is spoken as a k sound in this word."

  - id: d01-pron-unknown-05
    type: multiple_choice
    learning_area: Pronunciation
    origin: original
    topics: [pronunciation.unknown_words]
    difficulty: 2
    points: 1
    prompt: "Which is the preferred pronunciation of sword?"
    choices: ["SWORD", "SORD"]
    answer: "SORD"
    explanation: "The w is silent in sword."

  # Affected pronunciation (book section: Test 4, pronunciation_choice).
  - id: d01-pron-affected-01
    type: multiple_choice
    learning_area: Pronunciation
    origin: original
    topics: [pronunciation.affected]
    difficulty: 2
    points: 1
    prompt: "Which is the preferred pronunciation of been?"
    choices: ["BEEN", "BIN"]
    answer: "BIN"
    explanation: "Been is short in ordinary speech, with the vowel of bin."

  - id: d01-pron-affected-02
    type: multiple_choice
    learning_area: Pronunciation
    origin: original
    topics: [pronunciation.affected]
    difficulty: 2
    points: 1
    prompt: "Which is the preferred pronunciation of forehead?"
    choices: ["FOR-hed", "FOR-id"]
    answer: "FOR-id"
    explanation: "The word is said with two syllables and no separate h sound."

  - id: d01-pron-affected-03
    type: multiple_choice
    learning_area: Pronunciation
    origin: original
    topics: [pronunciation.affected]
    difficulty: 1
    points: 1
    prompt: "Which is the preferred pronunciation of width?"
    choices: ["WITH", "WIDTH"]
    answer: "WIDTH"
    explanation: "Width keeps the d and the th, and the vowel is short."

  - id: d01-pron-affected-04
    type: multiple_choice
    learning_area: Pronunciation
    origin: original
    topics: [pronunciation.affected]
    difficulty: 2
    points: 1
    prompt: "Which is the preferred pronunciation of clothes?"
    choices: ["KLOHTHZ", "KLOHZ"]
    answer: "KLOHZ"
    explanation: "The th is not spoken in clothes, so the word ends with z."

  - id: d01-pron-affected-05
    type: multiple_choice
    learning_area: Pronunciation
    origin: original
    topics: [pronunciation.affected]
    difficulty: 2
    points: 1
    prompt: "Which is the preferred pronunciation of hour?"
    choices: ["HOUR", "OW-er"]
    answer: "OW-er"
    explanation: "The h is silent in hour, so it sounds like our."
