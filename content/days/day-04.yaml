# Day 4: Test Your Grammar.
# Source: reference book, Fourth Day (pp. 25-30).
# Transcribed from pages/page27.md through page30.md, in the book's order.
# Imported verbatim at the owner's written instruction. The owner confirmed the rights to this text.
# This departs from the content rule in content/README.md ("Original wording only").
# App fields the book does not supply (difficulty, topics, points, vocabulary definition, example,
# audio_ref) were added for this app. origin is "original" only because the schema requires that value.
# Test 10 is a self-check test with no score. Its ten items are self_check exercises: they have no
# points and no answer key. Each item's explanation is the book's "How did you do?" note for that item.
# Status: draft until a human reviewer approves it (PRD section 11).
day: 4
title: "Test Your Grammar"

vocabulary:
  - word: "irregardless"
    definition: "nonstandard and wrong; the correct word is regardless"
    example: "Say regardless of the weather, not irregardless."
    audio_ref: "d04-vocab-irregardless"
  - word: "unique"
    definition: "without a like or equal, so words such as very or most before it are superfluous"
    example: "The painting is unique."
    audio_ref: "d04-vocab-unique"
  - word: "lay"
    definition: "means to place (something); when you mean rest or recline, say lie"
    example: "Lay the pillow on the bed."
    audio_ref: "d04-vocab-lay"

screens:
  - kind: "text"
    id: "d04-screen-introduction"
    learning_area: "Grammar"
    title: "Test Your Grammar"
    cards:
      - title: "Fourth Day: Test Your Grammar"
        body: |-
          Do you generally use words correctly? Are you usually sure—or only half sure? Let's put it to a test.

          *DOES YOUR GRAMMAR MAKE A GOOD IMPRESSION?*

          No one's grammar is perfect, of course, but conspicuously poor English (such as some of the usages listed below) wrench the listener's attention away from *what* a speaker is saying and direct it to the *error* he is making.
  - kind: "test"
    id: "d04-test-10"
    learning_area: "Grammar"
    title: "Test 10: Is Your English Free of Glaring Errors?"
    intro: "Be honest with yourself. Do some of the following patterns occur with any frequency in your own speech? If you can check the NO box in most instances, consider yourself safe. On the other hand, wherever you must admit that you are addicted to a particular error, a little thought and concentration, plus an awareness of the principle involved, can quickly and permanently eliminate the incorrect pattern."
    items:
      - id: "d04-gram-t10-01"
        type: "self_check"
        learning_area: "Grammar"
        origin: "original"
        topics: ["grammar.past_forms"]
        difficulty: 2
        prompt: "He *done*, I *seen* . . ."
        explanation: "*Done* and *seen* may be used only after *has*, *have*, or *had*, i.e., in the perfect tense. The correct past tense of these verbs is *did* and *saw*."
      - id: "d04-gram-t10-02"
        type: "self_check"
        learning_area: "Grammar"
        origin: "original"
        topics: ["grammar.word_choice"]
        difficulty: 3
        prompt: "*Irregardless* of what you say . . ."
        explanation: "The correct word is *regardless*; or, if you prefer to start with a negative prefix, say *irrespective*."
      - id: "d04-gram-t10-03"
        type: "self_check"
        learning_area: "Grammar"
        origin: "original"
        topics: ["grammar.agreement"]
        difficulty: 2
        prompt: "He *don't* like to . . ."
        explanation: "*Don't*, a contraction of *do not*, may be used only with a plural subject (or with the pronoun *I*). Say *doesn't* (a contraction of *does not*) with a singular subject: *he doesn't, she doesn't, it doesn't, the man doesn't*, etc."
      - id: "d04-gram-t10-04"
        type: "self_check"
        learning_area: "Grammar"
        origin: "original"
        topics: ["grammar.pronoun_case"]
        difficulty: 2
        prompt: "*Him* and *me* can come . . ."
        explanation: "*Him* and *me* are objective pronouns, as also are *her*, *us*, and *them*, and may not be used as subjects (i.e. before the verb). Say *He and I can come.*"
      - id: "d04-gram-t10-05"
        type: "self_check"
        learning_area: "Grammar"
        origin: "original"
        topics: ["grammar.agreement"]
        difficulty: 2
        prompt: "When his mother and father *was* alive . . ."
        explanation: "Two words connected by *and* take a plural verb—*his mother and father were alive*, *the book and pen are hers*, etc."
      - id: "d04-gram-t10-06"
        type: "self_check"
        learning_area: "Grammar"
        origin: "original"
        topics: ["grammar.word_choice"]
        difficulty: 1
        prompt: "I *ain't* happy about it . . ."
        explanation: "While *ain't* is a good serviceable word, it is never used by educated speakers except in jest."
      - id: "d04-gram-t10-07"
        type: "self_check"
        learning_area: "Grammar"
        origin: "original"
        topics: ["grammar.negatives"]
        difficulty: 2
        prompt: "We *can't hardly* . . ."
        explanation: "*Hardly* and *scarcely* are negative words—when you use them, keep the verb affirmative. Say *can hardly*, *can scarcely*, etc."
      - id: "d04-gram-t10-08"
        type: "self_check"
        learning_area: "Grammar"
        origin: "original"
        topics: ["grammar.negatives"]
        difficulty: 2
        prompt: "I don't need *no* money . . ."
        explanation: "Here again, the double negative must be avoided—say *I don't need any money*. How would you eliminate the error in these similar sentences? *I can't see no one; I won't go there no more; I didn't take none; I didn't talk to nobody; I didn't see it nowhere.*"
      - id: "d04-gram-t10-09"
        type: "self_check"
        learning_area: "Grammar"
        origin: "original"
        topics: ["grammar.determiners"]
        difficulty: 1
        prompt: "*This here* plan, *that there* statement . . ."
        explanation: "Omit *here* and *there*—say *this plan*, *that statement*."
      - id: "d04-gram-t10-10"
        type: "self_check"
        learning_area: "Grammar"
        origin: "original"
        topics: ["grammar.determiners"]
        difficulty: 1
        prompt: "*Them* books, *them* people . . ."
        explanation: "*Them* may not be used as an adjective—say *those* or *these*."
  - kind: "test"
    id: "d04-test-11"
    learning_area: "Grammar"
    title: "Test 11: Are You Clear on Some of the Following Important Points of Correct English?"
    intro: "The italicized word in some of the following sentences is used correctly — in others, it violates an established rule of grammar. Do you know which is which? If you can make at least six correct choices, your English is above average."
    items:
      - id: "d04-gram-t11-01"
        type: "multiple_choice"
        learning_area: "Grammar"
        origin: "original"
        topics: ["grammar.pronoun_case"]
        difficulty: 2
        points: 1
        prompt: "Test 11, item 1: He's not as tall as *me*. Is the italicized word right or wrong?"
        choices: ["RIGHT", "WRONG"]
        answer: "WRONG"
        explanation: "WRONG. As you will see if you add the final implied word, \"He's not as tall as I (am).\""
      - id: "d04-gram-t11-02"
        type: "multiple_choice"
        learning_area: "Grammar"
        origin: "original"
        topics: ["grammar.pronoun_case"]
        difficulty: 2
        points: 1
        prompt: "Test 11, item 2: You work faster than *her*. Is the italicized word right or wrong?"
        choices: ["RIGHT", "WRONG"]
        answer: "WRONG"
        explanation: "WRONG. As before, if you finish the sentence you can determine the correct word: \"You work faster than she (does).\""
      - id: "d04-gram-t11-03"
        type: "multiple_choice"
        learning_area: "Grammar"
        origin: "original"
        topics: ["grammar.pronoun_case"]
        difficulty: 2
        points: 1
        prompt: "Test 11, item 3: Would you like to visit my brother and *I* tonight? Is the italicized word right or wrong?"
        choices: ["RIGHT", "WRONG"]
        answer: "WRONG"
        explanation: "WRONG. You would say, \". . . visit me,\" not I; hence, \". . . visit my brother and me.\" When undecided about a pronoun following and, say it over, leaving out the preceding words, and you can't go wrong. For example: He saw (John and) me (not I); We can do without (you and) her (not she); Can you talk to (them and) us (not we)?"
      - id: "d04-gram-t11-04"
        type: "multiple_choice"
        learning_area: "Grammar"
        origin: "original"
        topics: ["grammar.lie_lay"]
        difficulty: 2
        points: 1
        prompt: "Test 11, item 4: If you don't feel well, why don't you *lay* down for a while? Is the italicized word right or wrong?"
        choices: ["RIGHT", "WRONG"]
        answer: "WRONG"
        explanation: "WRONG. Lay means to place (something), as Lay the pillow on the bed. When you mean rest or recline, say lie."
      - id: "d04-gram-t11-05"
        type: "multiple_choice"
        learning_area: "Grammar"
        origin: "original"
        topics: ["grammar.lie_lay"]
        difficulty: 2
        points: 1
        prompt: "Test 11, item 5: He felt so weak that he just *lay* asleep all day. Is the italicized word right or wrong?"
        choices: ["RIGHT", "WRONG"]
        answer: "RIGHT"
        explanation: "RIGHT. The past tense of lie (to recline or rest) is, strangely enough, lay, not laid or lied. The past of lay is laid: They laid the foundation of the building this morning."
      - id: "d04-gram-t11-06"
        type: "multiple_choice"
        learning_area: "Grammar"
        origin: "original"
        topics: ["grammar.agreement"]
        difficulty: 2
        points: 1
        prompt: "Test 11, item 6: Two new schools are now being built, but neither of them *is* finished. Is the italicized word right or wrong?"
        choices: ["RIGHT", "WRONG"]
        answer: "RIGHT"
        explanation: "RIGHT. Neither of means neither one of, so requires a singular verb. The same rule applies to either of."
      - id: "d04-gram-t11-07"
        type: "multiple_choice"
        learning_area: "Grammar"
        origin: "original"
        topics: ["grammar.adjective_absolutes"]
        difficulty: 2
        points: 1
        prompt: "Test 11, item 7: This is a *most* unique house. Is the italicized word right or wrong?"
        choices: ["RIGHT", "WRONG"]
        answer: "WRONG"
        explanation: "WRONG. Unique means without a like or equal, so any modifying adjective is superfluous."
      - id: "d04-gram-t11-08"
        type: "multiple_choice"
        learning_area: "Grammar"
        origin: "original"
        topics: ["grammar.pronoun_case"]
        difficulty: 2
        points: 1
        prompt: "Test 11, item 8: Let's keep this strictly between you and *me*. Is the italicized word right or wrong?"
        choices: ["RIGHT", "WRONG"]
        answer: "RIGHT"
        explanation: "RIGHT. After between, which is a preposition, use only the objective forms of the pronoun: me, him, her, us, them. Other prepositions you must learn to be wary of, when a pronoun follows, are: except, but (meaning except), to, with, without, for, from, and against. Study these: a. No one's here except us. b. Everyone's satisfied but her. c. Will you speak to Sam and me? d. May I go with you and him? e. We can get along without you and them."
