# Day 5: Just for Fun (I).
# Structure follows Part I, Day 5 of the reference book (learning goals and
# progression only). All wording, items, answers and explanations are original.
# Status: draft until a human reviewer approves it (PRD section 11).
day: 5
title: "Just for Fun (I)"

lessons:
  - id: d05-lesson-antonyms
    learning_area: Vocabulary
    title: "Opposites that start with R"
    cards:
      - title: What an antonym is
        body: "An antonym is a word with the opposite meaning of another word. To find one, you must know the meaning of the first word well."
        examples:
          - "Hot and cold are antonyms."
          - "Rise and fall are antonyms."
      - title: Start from the meaning
        body: "Think about what the given word means before you think about spelling. Then look for the reverse meaning that starts with the required letter."
        examples:
          - "The opposite of reward is punish, and the opposite of punish is reward."
        watch_out: "A word can have more than one opposite. Accept any answer that fits the meaning and the letter."

  - id: d05-lesson-eponyms
    learning_area: Vocabulary
    title: "Words named after people"
    cards:
      - title: Sandwich
        body: "A popular story says that the fourth Earl of Sandwich asked for meat between two slices of bread, so he could eat without leaving the card table. The food took its name from his title."
        examples:
          - "He packed a sandwich for the trip."
      - title: Leotard
        body: "Jules Leotard was a French acrobat in the 1800s. He wore a close-fitting, one-piece costume, and the garment is named after him."
        examples:
          - "She wore a leotard to dance class."
      - title: Cardigan
        body: "The knitted jacket is named after James Brudenell, the seventh Earl of Cardigan, a British army officer in the 1850s. The name passed from the earl to the garment."
        examples:
          - "He buttoned his cardigan against the cold."

  - id: d05-lesson-word-histories
    learning_area: Vocabulary
    title: "Word histories and trivia"
    cards:
      - title: Italic type
        body: "Italic type is slanted. It is named after Italy, because a Venetian printer, Aldus Manutius, introduced it around the year 1500."
        examples:
          - "Book titles are often printed in italic."
      - title: Whiskey
        body: "The word whiskey comes from an Irish phrase that means water of life."
        examples:
          - "He ordered a whiskey with ice."
      - title: British and American words
        body: "In Britain, a streetcar is called a tram, and a movie theatre is called a cinema. Learn the local word when you travel, so you are understood."
        examples:
          - "The tram stops near the park."

vocabulary:
  - word: synonym
    definition: a word with nearly the same meaning as another word
    example: Big and large are synonyms.
    audio_ref: d05-vocab-synonym
  - word: antonym
    definition: a word with the opposite meaning of another word
    example: Light is an antonym of heavy.
    audio_ref: d05-vocab-antonym
  - word: eponym
    definition: a word that comes from the name of a real person
    example: Sandwich is an eponym.
    audio_ref: d05-vocab-eponym
  - word: italic
    definition: a slanted style of printed letters
    example: The quotation is printed in italic.
    audio_ref: d05-vocab-italic
  - word: cardigan
    definition: a knitted jacket that opens at the front
    example: She wore a warm cardigan on the bus.
    audio_ref: d05-vocab-cardigan
  - word: sandwich
    definition: food made of fillings between two slices of bread
    example: I packed a cheese sandwich for lunch.
    audio_ref: d05-vocab-sandwich
  - word: leotard
    definition: a close-fitting, one-piece garment worn for dance or sport
    example: The dancer wore a black leotard.
    audio_ref: d05-vocab-leotard
  - word: whiskey
    definition: a strong alcoholic drink made from grain
    example: He poured a small glass of whiskey.
    audio_ref: d05-vocab-whiskey

