day: 5
title: "Just for Fun (I)"

lessons:
  - id: d05-lesson-fluency
    learning_area: Vocabulary
    title: "Test Your Fluency"
    cards:
      - title: "Fifth Day: Just for Fun (I)"
        body: |-
          **Subsection:** I. TEST YOUR FLUENCY

          How quickly can you call words to mind? Here is a reliable test of your vocabulary responsiveness. In five minutes or less, write next to each of the following words a word which starts with *R* and is essentially *opposite* in meaning to, or in contrast with, the given word. *Examples: walk—run; imaginary—real; square—round.*

  - id: d05-lesson-name-behind-word
    learning_area: Vocabulary
    title: "II. The Name Behind the Word"
    cards:
      - title: "The Name Behind the Word"
        body: |-
          **BOYCOTT:** Captain Charles C. Boycott had a run-in with some Irish farmers who refused to pay the exorbitant rents demanded by his company. The sons of Eire boycotted Boycott's home and refused to let anyone work for him.

          **GAT:** Richard Jordan Gatling invented the first machine gun in 1861.

          **MARCEL WAVE:** Marcel was a famous French hairdresser who made a fortune out of his new idea in coiffures.

          **SILHOUETTE:** Etienne de Silhouette was finance minister of France just before the Revolution. He insisted that the nobles lead simpler lives, thus saving money, which, of course, they could donate to the government. The silhouette (as it was later called) was invented at about this time and was obviously a very simple sort of portraiture. The connection of ideas appealed to the Parisian mind, and the minister's name was soon used to describe the new art form.

  - id: d05-lesson-did-you-know
    learning_area: Vocabulary
    title: "III. Did You Know That"
    cards:
      - title: "Did You Know That"
        body: |-
          Italics are so called because this kind of type was first used by the Italian, Aldus Manutius, famous printer of Venice.

          *Drat it* is not so mild a curse as it may seem. It is a contraction of *May God rot it*.

          Calling an attractive girl a *peach*, far from being modern slang, goes back at least to 1896.

          In England a *streetcar* is called a *tram*; a *cookie jar* is known as a *biscuit barrel*; *molasses* is known as *treacle*; and the *movies* are called the *cinema*.

          *Whiskey* is from the Irish *uisgebeatha* meaning *water of life*.

  - id: d05-lesson-think-of-words
    learning_area: Vocabulary
    title: "IV. Think of Words"
    cards:
      - title: "Think of Words"
        body: |-
          Can you think of 10 words ending in *-ANK*? Add one or two letters only, to fit each definition.

          Now your problem is to think of a word *opposed* in meaning to the definition offered. The initial letter is supplied.

