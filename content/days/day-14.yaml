  - kind: "text"
    id: "d14-screen-misplaced-months"
    title: "I. The Misplaced Months"
    cards:
      - title: "The Misplaced Months"
        body: |-
          If you ever studied Latin, you have no doubt wondered why *September*, named after the Latin numeral *septem* (seven), stands for our ninth month. And why *October*, *November*, and *December*, respectively from the Roman numbers *octo* (eight), *novem* (nine), and *decem* (ten), actually refer to our tenth, eleventh, and twelfth months. The explanation is simple: The old Roman calendar started with March, not January, and September, October, November, and December *were* the seventh, eighth, ninth, and tenth months in early Roman times. When we revised the calendar, we slipped in two extra months at the beginning of the year but never got around to changing the four misleading names.
  - kind: "test"
    id: "d14-test-whats-wrong"
    title: "II. What's Wrong With This?"
    intro: "Type each sentence with its error corrected. If a sentence is already acceptable English, type it unchanged."
    explain: true
    items:
      - id: "d14-wrong-01"
        type: "spelling_correction"
        learning_area: "Grammar"
        origin: "original"
        topics: ["grammar.agreement"]
        difficulty: 2
        points: 1
        prompt: "Test II, item 1: Correct this sentence."
        text: "This criteria is not, in my opinion, very reliable."
        accepted: ["These criteria are not, in my opinion, very reliable."]
        explanation: "*Criteria* is a plural noun, although admittedly it has an amazing resemblance to a singular. (The singular form is *criterion*.) Hence, adjective *this* and verb *is* should also be plural. Correct form: *These criteria are not . . . reliable.*"
      - id: "d14-wrong-02"
        type: "spelling_correction"
        learning_area: "Grammar"
        origin: "original"
        topics: ["grammar.word_choice"]
        difficulty: 2
        points: 1
        prompt: "Test II, item 2: Correct this sentence."
        text: "The alumni of Girls' High School will hold their annual meeting in April."
        accepted: ["The alumnae of Girls' High School will hold their annual meeting in April."]
        explanation: "Graduates of a girls' school would likely be females. *Alumni*, plural of *alumnus*, refers only to males. Correct word in the sentence offered: *alumnae*, plural of *alumna*, the feminine form of *alumnus*. Pronounce them as follows: *alumni*: ə-LUM'-nye; *alumnae*: ə-LUM'-nee."
      - id: "d14-wrong-03"
        type: "spelling_correction"
        learning_area: "Grammar"
        origin: "original"
        topics: ["grammar.lie_lay"]
        difficulty: 2
        points: 1
        prompt: "Test II, item 3: Correct this sentence."
        text: "Why don't you lay down for a nap before dinner?"
        accepted: ["Why don't you lie down for a nap before dinner?"]
        explanation: "The verb is wrong. *Lay* means to place or put. The required form, which would mean to rest or recline, is *lie*."
      - id: "d14-wrong-04"
        type: "spelling_correction"
        learning_area: "Grammar"
        origin: "original"
        topics: ["grammar.word_choice"]
        difficulty: 2
        points: 1
        prompt: "Test II, item 4: Correct this sentence."
        text: "I'm surprised you didn't get an invite to Charlie Jerome's party."
        accepted: ["I'm surprised you didn't get an invitation to Charlie Jerome's party."]
        explanation: "*Invite* may be used only as a verb. Proper form: *invitation*."
      - id: "d14-wrong-05"
        type: "spelling_correction"
        learning_area: "Grammar"
        origin: "original"
        topics: ["grammar.word_choice"]
        difficulty: 3
        points: 1
        prompt: "Test II, item 5: This sentence is already acceptable English. Type it unchanged."
        text: "What an aggravating child she is!"
        accepted: ["What an aggravating child she is!"]
        explanation: "The original meaning of *aggravate* was to make worse, to intensify, and so grammarians have in the past warned against its use as a synonym for *exasperate* or *irritate*. However, words change with usage, and since *aggravating* is now widely used in both speech and writing with the meaning of *annoying*, the sentence as it stands is acceptable English."
      - id: "d14-wrong-06"
        type: "spelling_correction"
        learning_area: "Grammar"
        origin: "original"
        topics: ["grammar.pronoun_case"]
        difficulty: 2
        points: 1
        prompt: "Test II, item 6: Correct this sentence."
        text: "No one but I can help you."
        accepted: ["No one but me can help you."]
        explanation: "In this sentence, *but* means *except* and is a preposition. According to grammatical rule, prepositions govern the objective case of the pronoun; hence, the proper phrasing is: *No one but me can help you.*"
      - id: "d14-wrong-07"
        type: "spelling_correction"
        learning_area: "Grammar"
        origin: "original"
        topics: ["grammar.agreement"]
        difficulty: 3
        points: 1
        prompt: "Test II, item 7: Correct this sentence."
        text: "It is I who is responsible for this trouble."
        accepted: ["It is I who am responsible for this trouble."]
        explanation: "*Who* takes the same verb as does its antecedent. The antecedent of *who* in this sentence is *I*. Since we say *I am*, not *I is*, the sentence should read: *It is I who am responsible . . .*"
      - id: "d14-wrong-08"
        type: "spelling_correction"
        learning_area: "Grammar"
        origin: "original"
        topics: ["grammar.word_choice"]
        difficulty: 2
        points: 1
        prompt: "Test II, item 8: This sentence is already acceptable English. Type it unchanged."
        text: "Can I borrow your pen if you're not using it?"
        accepted: ["Can I borrow your pen if you're not using it?"]
        explanation: "Purists rail against the use of *can* to seek permission, and parents from time immemorial (and with little success) have attempted to train their children to show politeness by using *may* as a substitute. Nevertheless, it is today established and cultivated usage to ask permission with the verb *can*."
      - id: "d14-wrong-09"
        type: "spelling_correction"
        learning_area: "Grammar"
        origin: "original"
        topics: ["grammar.word_choice"]
        difficulty: 3
        points: 1
        prompt: "Test II, item 9: Correct this sentence."
        text: "What affect does he have on you?"
        accepted: ["What effect does he have on you?"]
        explanation: "Except with a special and technical meaning in psychology, *affect* is used only as a verb. Here a noun is required. Correct form: *effect*."
      - id: "d14-wrong-10"
        type: "spelling_correction"
        learning_area: "Grammar"
        origin: "original"
        topics: ["grammar.word_choice"]
        difficulty: 3
        points: 1
        prompt: "Test II, item 10: Correct this sentence."
        text: "How does he effect you?"
        accepted: ["How does he affect you?"]
        explanation: "In this sentence a verb is required. Correct form: *affect*."
