# Day 13: A Challenge to Your Vocabulary.
# Source: reference book, Thirteenth Day (pp. 92-97).
# Transcribed from pages/page92.md through page97.md, in the book's order.
# Imported verbatim at the owner's written instruction. The owner confirmed the rights to this text.
# This departs from the content rule in content/README.md ("Original wording only").
# App fields the book does not supply (difficulty, topics, points, vocabulary definition, example,
# audio_ref, and the test intro for Tests 1 and 2, which have no instruction line in the book) were
# added for this app. origin is "original" only because the schema requires that value.
# Explanations are the book's own where it gives them. Where it gives only the key, the explanation
# is "Key: ..." and the test does not show explanations (explain is false).
# Status: draft until a human reviewer approves it (PRD section 11).
day: 13
title: "A Challenge to Your Vocabulary"

vocabulary:
  - word: "obstetrician"
    definition: "a doctor who delivers babies"
    example: "The obstetrician stayed with the mother through the night."
    audio_ref: "d13-vocab-obstetrician"
  - word: "virtuoso"
    definition: "a person with exceptional skill in an art, especially music"
    example: "The violinist was a virtuoso who played every note with ease."
    audio_ref: "d13-vocab-virtuoso"
  - word: "choreographer"
    definition: "a person who arranges the steps of a ballet or dance"
    example: "The choreographer taught the dancers a new routine."
    audio_ref: "d13-vocab-choreographer"
  - word: "aesthete"
    definition: "someone who devotes their life to beauty"
    example: "The aesthete spent every weekend visiting galleries and concerts."
    audio_ref: "d13-vocab-aesthete"
  - word: "entomology"
    definition: "the study of insects"
    example: "She is studying entomology and has collected over a hundred beetles."
    audio_ref: "d13-vocab-entomology"
  - word: "amnesia"
    definition: "loss of memory"
    example: "After the accident he had amnesia and could not recall his own name."
    audio_ref: "d13-vocab-amnesia"
  - word: "claustrophobia"
    definition: "morbid fear of enclosed spaces"
    example: "Her claustrophobia made the crowded elevator difficult to bear."
    audio_ref: "d13-vocab-claustrophobia"
  - word: "soliloquize"
    definition: "to speak aloud to oneself"
    example: "The actor began to soliloquize on the empty stage."
    audio_ref: "d13-vocab-soliloquize"
  - word: "alleviate"
    definition: "to diminish or lessen"
    example: "The cool drink helped to alleviate the heat."
    audio_ref: "d13-vocab-alleviate"
  - word: "cower"
    definition: "to crouch in fear"
    example: "The puppy began to cower under the table during the storm."
    audio_ref: "d13-vocab-cower"
  - word: "malign"
    definition: "to slander, or gossip about, someone"
    example: "It is unkind to malign a neighbor behind their back."
    audio_ref: "d13-vocab-malign"
  - word: "parsimonious"
    definition: "stingy, tight-fisted"
    example: "The parsimonious landlord never repaired anything."
    audio_ref: "d13-vocab-parsimonious"

screens:
  - kind: "text"
    id: "d13-screen-introduction"
    title: "A Challenge to Your Vocabulary"
    cards:
      - title: "Thirteenth Day"
        body: |-
          *Here are 50 more words that should be in every educated person's vocabulary — how successfully can you learn them?*

          A test can be used for one of two purposes: to check on your knowledge, or to motivate your learning. These tests have the latter end in view.

          It is true in a sense that if you cannot answer a question you thereby display your ignorance. It is equally true, and far more important, that when you finally discover the correct answer to the question you thereupon erase that ignorance.

          In the five tests which follow you will be asked 50 questions — *and your learning will come from the questions you cannot answer.* Each test will take you no more than three minutes. Go through the tests quickly, guessing as wildly as you like; then pay particular attention to the answers. For every mistake you make you will learn a new word. The more errors, the more words you will add to your vocabulary. So have no fear of coming through with a low score — the lower it is, the greater you gain!
