# Run from the repository root:
#   uv run --project tests pytest -c tests/pytest.ini tests
# The API tests also need apps/api on the path; see tests/README.md.
[pytest]
testpaths = api content
# "." makes the shared harness modules in tests/ importable; "../apps/api/src" makes english_quest_api importable.
pythonpath = . ../apps/api/src
addopts = -ra --strict-markers --continue-on-collection-errors
xfail_strict = true
