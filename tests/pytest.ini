# Run from the repository root:
#   uv run --project tests pytest -c tests/pytest.ini
# The API tests also need apps/api on the path; see tests/README.md.
[pytest]
testpaths = api content
# "." makes tests/api/api_fixtures importable; "../apps/api/src" makes english_quest_api importable.
pythonpath = . ../apps/api/src
addopts = -ra --strict-markers
xfail_strict = true
